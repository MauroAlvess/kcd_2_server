<script>
"use strict";const send=(e,t)=>{if(typeof callEvent==="function"){callEvent(e,t===undefined?null:JSON.stringify(t))}};const log=document.getElementById("log");const input=document.getElementById("text");const modeBtn=document.getElementById("modeBtn");const modeLab=document.getElementById("modeLab");const menu=document.getElementById("menu");const KEEP=120;const FADE_MS=14e3;const HISTORY=40;const history=[];let recalled=0;let open=false;let openedAt=0;const MODES=[{id:"",label:"Falar",hint:"A fala do seu personagem."},{id:"/me",label:"/me",hint:"O que o seu personagem faz."},{id:"/do",label:"/do",hint:"Descreve a cena ou um detalhe dela."},{id:"/try",label:"/try",hint:"Tenta algo: dá certo ou não, ao acaso."},{id:"/dice",label:"/dice",hint:"Convida alguém para os dados."},{id:"/anim",label:"/anim",hint:"Procura e toca animações do jogo."},{id:"/face",label:"/face",hint:"Muda a expressão do rosto."},{id:"/camera",label:"/camera",hint:"Primeira ou terceira pessoa."},{id:"/idioma",label:"/idioma",hint:"Idioma: pt ou en."},{id:"/help",label:"/help",hint:"Lista os comandos."}];const ICONS={talk:'<svg viewBox="0 0 16 16"><path d="M2 2.2h12v8.6H8.4L5 14v-3.2H2z"/><path d="M4.4 5h7.2v1.2H4.4zM4.4 7.4h4.6v1.2H4.4z" fill="#d2b38c"/></svg>',cmd:'<svg viewBox="0 0 16 16"><path d="M10.2 1.4h2L6.4 14.6h-2z"/></svg>',caret:'<svg viewBox="0 0 16 16"><path d="M3 10.5h10L8 4.5z"/></svg>'};document.getElementById("modeCaret").innerHTML=ICONS.caret;const modeOf=e=>{const t=/^\/([A-Za-zÀ-ÿ]+)(\s|$)/.exec(e);if(t===null){return MODES[0]}return MODES.find((e=>e.id==="/"+t[1].toLowerCase()))||{id:"/"+t[1].toLowerCase(),label:"/"+t[1].toLowerCase(),hint:""}};const showMode=()=>{const e=modeOf(input.value);modeLab.textContent=e.label;document.getElementById("modeIc").innerHTML=e.id===""?ICONS.talk:ICONS.cmd;for(const t of menu.children){t.classList.toggle("on",t.dataset.id===e.id)}};const closeMenu=()=>{menu.classList.remove("open");modeBtn.classList.remove("open")};const pickMode=e=>{const
