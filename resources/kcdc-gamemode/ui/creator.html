<button class="gender" id="g-female"><b>FEMINA</b><span>mulher</span></button>
</div>
</section>
<section class="row">
<div class="k">Capillus<em>cabelo</em></div>
<div class="sel" id="s-hair"></div>
</section>
<section class="row">
<div class="k">Color<em>cor do cabelo</em></div>
<div class="tones" id="tones"></div>
</section>
<section class="row">
<div class="k">Facies<em>rosto</em></div>
<div class="sel" id="s-head"></div>
</section>
<section class="row">
<div class="k">Barba<em>só para homens</em></div>
<div class="sel" id="s-beard"></div>
</section>

<div class="k">Cutis<em>pele</em></div>
<div class="sel" id="s-skin"></div>
</section>

<div>
<div class="k">Aetas<em>idade</em></div>
<div class="sel" id="s-age"></div>
</div>
<div>

</div>
</section>

<section class="row">
<div class="k">Agnomen<em>alcunha, se quiser</em></div>
<div class="dd" id="dd"></div>
<div class="known" id="known"></div>
</section>
</main>
<main class="clothes" id="clothes" hidden></main>
<footer class="foot">
<button class="btn ghost" id="dice" title="Um visual ao acaso">Sortear</button>
<button class="btn ghost" id="back" hidden>Voltar</button>
<button class="btn go" id="next" hidden>Próximo</button>

<div>

<div class="btns">
<button class="btn ghost" id="sure-stay">Continuar</button>

</div>
</div>
</div>
</aside>
