</div>

<div class="layer sheen"></div>

<div class="bar"><i></i><i></i></div>

</header>
<main class="rows" id="rows">
<section class="row">
<div class="k">Sexus<em>homem ou mulher</em></div>
<div class="sexus">
<button class="gender" id="g-male"><b>VIR</b><span>homem</span></button>
<button class="gender" id="g-female"><b>FEMINA</b><span>mulher</span></button>
</div>
</section>
<section class="row">
<div class="k">Capillus<em>cabelo</em></div>
<div class="sel" id="s-hair"></div>
</section>
<section class="row">
<div class="k">Color<em>cor do cabelo</em></div>
<div class="tones" id="tones"></div>
</section>
<section class="row">
<div class="k">Facies<em>rosto</em></div>
<div class="sel" id="s-head"></div>
</section>
<section class="row">
<div class="k">Barba<em>só para homens</em></div>
<div class="sel" id="s-beard"></div>
</section>
<section class="row">
<div class="k">Cutis<em>pele</em></div>
<div class="sel" id="s-skin"></div>
</section>
<section class="row">
<div class="k">Nomen<em>o primeiro nome</em></div>
<input class="field" id="name" type="text" maxlength="16" autocomplete="off" spellcheck="false">
<div class="hint" id="hint"></div>
</section>
<section class="row">
<div class="k">Agnomen<em>alcunha, se quiser</em></div>
<div class="dd" id="dd"></div>
<div class="known" id="known"></div>
</section>
</main>
<footer class="foot">
<button class="btn ghost" id="dice" title="Um visual ao acaso">Sortear</button>
<button class="btn go" id="save">Salvar e criar</button>
</footer>
<div class="sure" id="sure" hidden>
<div>
<h3 id="sure-h">Sair?</h3>
<p id="sure-p"></p>
<div class="btns">
<button class="btn ghost" id="sure-stay">Continuar</button>
<button class="btn" id="sure-leave">Sair</button>
</div>
</div>
</div>
</aside>
</div>
