<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kingdom RP BRASIL - Chat</title>
<style>
    /* The chat of the game, drawn by us (user, 2026-10-18: "o card de chat do T na parte inferior esquerda ... em um design nosso"; 2026-10-24: "vamos
       deixar mais simples o menu de texto que abre o apertar T, ele ficar com a cara de nossa identidade visual igual os menus que abrem na direita
       de ofícios"; and the same evening: "vamos colocar também a borda nossa que usamos de imagem na esquerda e direita, além de no campo de texto
       ter na esquerda um dropdown com opções do usuário usar, por exemplo /me"). The view is a rectangle at the bottom left of the screen, above
       the Kingdoms Connected logo; the page fills it. Shut, only the lines that are new show, each on a plate of paper, and they fade; open (T), the
       whole talk shows on a card of paper like the panel's and the trades' page (the same paper, rule and red, and the corners of gilded image at
       the top left and the bottom right), and the writing line comes up under it, with a menu of the commands a player has at its left. */
    @font-face {
        font-family: "Cinzel";
        src: url("fonts/cinzel.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
    }

    :root {
        --btn: rgba(124, 3, 5, 0.992);
        --bg: rgba(210, 179, 140, 0.992);
        --ink: rgba(32, 27, 23, 0.99);
        --ink-2: rgba(32, 27, 23, .66);
        --rule: rgba(32, 27, 23, .30);
        --display: "Cinzel", "Palatino Linotype", Georgia, serif;
        --body: "Constantia", "Sitka Text", Georgia, "Palatino Linotype", serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 15px; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font: 1rem/1.4 var(--body); color: var(--ink); user-select: none; font-variant-numeric: lining-nums; }
    button { font-family: var(--display); color: inherit; cursor: pointer; background: none; border: 0; }
    button, button:focus, input { outline: none; }

    /* The page keeps a margin all round, so that the corners can hang over the edge of the card without leaving the view. */
    .chat { position: fixed; inset: 0; padding: .9rem; }
    .frame { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: .4rem; }

    /* The corners of the panel: the top left and the bottom right, drawn only while the chat is open. */
    .orn { display: none; position: absolute; width: 5rem; height: auto; z-index: 6; pointer-events: none; filter: drop-shadow(0 .25rem .4rem rgba(20, 12, 4, .4)); -webkit-user-drag: none; }
    body.open .orn { display: block; }
    .orn-tl { top: -.8rem; left: -.8rem; }
    .orn-br { right: -.8rem; bottom: -.8rem; }

    /* The card holds the log: bare while the chat is shut, a sheet of paper when it is open. */
    .card { position: relative; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; }
    body.open .card { flex: 1 1 auto; padding: .5rem; border: 1px solid var(--rule); box-shadow: 0 0 0 .3rem rgba(210, 179, 140, .22), 0 .9rem 2rem rgba(20, 12, 4, .5); background-color: var(--bg); background-image: radial-gradient(ellipse 80% 55% at 24% 12%, rgba(255, 244, 214, .5), transparent 72%), url("img/paper.svg"); background-blend-mode: normal, multiply; }
    body.open .card::before { content: ""; position: absolute; inset: .3rem; border: 1px solid var(--rule); pointer-events: none; }

    /* The log: lines pile up from the bottom, so that a short talk sits next to the writing line. */
    .log { position: relative; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; gap: .22rem; overflow: hidden; }
    .log > :first-child { margin-top: auto; }
    body.open .log { flex: 1 1 auto; overflow-y: auto; padding: 1.4rem .45rem .25rem .3rem; }

    .line { width: fit-content; max-width: 100%; padding: .22rem .7rem .26rem .7rem; background: rgba(214, 184, 142, .92); color: var(--ink); border-left: 3px solid var(--tint, var(--btn)); box-shadow: 0 .12rem .45rem rgba(20, 12, 4, .35); white-space: pre-wrap; overflow-wrap: anywhere; transition: opacity 1.2s ease; }
    .line.sys { font-style: italic; color: var(--ink-2); }
    .line.gone { opacity: 0; }
    .line.off { display: none; }
    .who { margin-right: .55rem; font: 700 .72rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--btn); }
    body.open .line { display: block; width: auto; background: transparent; box-shadow: none; opacity: 1; padding: .12rem .2rem .16rem .55rem; border-left-width: 2px; }

    /* The writing line: a plate of paper with a red foot, the commands' menu at its left and the field beside it. */
    .bar { display: none; align-items: center; gap: .55rem; padding: .35rem 1.9rem .35rem .45rem; background: var(--bg); border: 1px solid var(--rule); border-bottom: 3px solid var(--btn); box-shadow: 0 .5rem 1.2rem rgba(20, 12, 4, .45); }
    body.open .bar { display: flex; }
    .bar input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 1.05rem/1.3 var(--body); padding: .1rem .1rem; user-select: text; }
    .bar input::placeholder { color: var(--ink-2); font-style: italic; }

    .mode { position: relative; flex: none; }
    .modebtn { display: flex; align-items: center; gap: .35rem; padding: .3rem .5rem; background: rgba(255, 247, 226, .35); border: 1px solid var(--rule); font: 700 .64rem/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; transition: background .12s, border-color .12s; }
    .modebtn:hover, .modebtn.open { background: rgba(255, 247, 226, .6); border-color: var(--btn); }
    .ic { flex: none; display: inline-grid; place-items: center; width: .95rem; height: .95rem; color: var(--btn); }
    .ic svg { width: 100%; height: 100%; fill: currentColor; }
    .modebtn .caret { width: .7rem; height: .7rem; color: var(--ink-2); }
    .menu { display: none; position: absolute; left: 0; bottom: calc(100% + .5rem); z-index: 20; width: max-content; min-width: 13rem; max-width: 20rem; max-height: 16rem; max-height: min(16rem, calc(100vh - 6.4rem)); overflow-y: auto; padding: .25rem; background: rgba(222, 196, 158, .99); border: 1px solid var(--rule); box-shadow: 0 .6rem 1.6rem rgba(10, 6, 2, .5); }
    .menu.open { display: block; }
    .menu button { display: flex; align-items: baseline; gap: .65rem; width: 100%; padding: .26rem .5rem; text-align: left; }
    .menu button:hover, .menu button.on { background: rgba(124, 3, 5, .12); }
    .menu .cmd { flex: none; min-width: 3.5rem; font: 700 .72rem/1.2 var(--display); letter-spacing: .06em; color: var(--btn); }
    .menu .hint { font: italic .8rem/1.25 var(--body); color: var(--ink-2); }

    /* The gilded scroll bar of the panel. */
    *::-webkit-scrollbar { width: .6rem; }
    *::-webkit-scrollbar-track { background: linear-gradient(90deg, transparent 38%, rgba(32, 27, 23, .16) 38%, rgba(32, 27, 23, .16) 62%, transparent 62%); }
    *::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #cfa95f, #8a6a2c); background-clip: padding-box; border: 2px solid transparent; border-radius: .5rem; box-shadow: inset 0 0 0 1px rgba(70, 45, 10, .5); }
</style>
</head>
<body>
<div class="chat">
    <div class="frame">
        <div class="card"><div class="log" id="log"></div></div>
        <div class="bar" id="bar">
            <div class="mode">
                <button class="modebtn" id="modeBtn" type="button" title="Comandos"><span class="ic" id="modeIc"></span><span id="modeLab">Falar</span><span class="ic caret" id="modeCaret"></span></button>
                <div class="menu" id="menu"></div>
            </div>
            <input id="text" type="text" maxlength="300" spellcheck="false" autocomplete="off" placeholder="Escreva e aperte Enter">
        </div>
        <img class="orn orn-tl" src="img/frame-corner-tl.webp" alt="">
        <img class="orn orn-br" src="img/frame-corner-br.webp" alt="">
    </div>
</div>

<script>
"use strict";

const send = (name, payload) => {
    if (typeof callEvent === "function") {
        callEvent(name, payload === undefined ? null : JSON.stringify(payload));
    }
};

const log = document.getElementById("log");
const input = document.getElementById("text");
const modeBtn = document.getElementById("modeBtn");
const modeLab = document.getElementById("modeLab");
const menu = document.getElementById("menu");

/* The lines kept, and how long a new one stays on the screen while the writing line is shut. */
const KEEP = 120;
const FADE_MS = 14000;
const HISTORY = 40;
const history = [];
let recalled = 0;
let open = false;
let openedAt = 0;

/* The commands a player has and is likely to write (the ones of COMMON_COMMANDS that take words); choosing one puts it at the head of the line.
   "Falar" is no command: the line goes as it is written. */
const MODES = [
    { id: "", label: "Falar", hint: "A fala do seu personagem." },
    { id: "/me", label: "/me", hint: "O que o seu personagem faz." },
    { id: "/do", label: "/do", hint: "Descreve a cena ou um detalhe dela." },
    { id: "/try", label: "/try", hint: "Tenta algo: dá certo ou não, ao acaso." },
    { id: "/dice", label: "/dice", hint: "Convida alguém para os dados." },
    { id: "/anim", label: "/anim", hint: "Procura e toca animações do jogo." },
    { id: "/face", label: "/face", hint: "Muda a expressão do rosto." },
    { id: "/camera", label: "/camera", hint: "Primeira ou terceira pessoa." },
    { id: "/idioma", label: "/idioma", hint: "Idioma: pt ou en." },
    { id: "/help", label: "/help", hint: "Lista os comandos." },
];

const ICONS = {
    talk: '<svg viewBox="0 0 16 16"><path d="M2 2.2h12v8.6H8.4L5 14v-3.2H2z"/><path d="M4.4 5h7.2v1.2H4.4zM4.4 7.4h4.6v1.2H4.4z" fill="#d2b38c"/></svg>',
    cmd: '<svg viewBox="0 0 16 16"><path d="M10.2 1.4h2L6.4 14.6h-2z"/></svg>',
    caret: '<svg viewBox="0 0 16 16"><path d="M3 10.5h10L8 4.5z"/></svg>',
};
document.getElementById("modeCaret").innerHTML = ICONS.caret;

/* What the line starts with, as a mode of the list ("/me " and "/me" alone are "/me"), or the plain one. */
const modeOf = (text) => {
    const match = /^\/([A-Za-zÀ-ÿ]+)(\s|$)/.exec(text);
    if (match === null) {
        return MODES[0];
    }
    return MODES.find((mode) => mode.id === "/" + match[1].toLowerCase()) || { id: "/" + match[1].toLowerCase(), label: "/" + match[1].toLowerCase(), hint: "" };
};

const showMode = () => {
    const mode = modeOf(input.value);
    modeLab.textContent = mode.label;
    document.getElementById("modeIc").innerHTML = mode.id === "" ? ICONS.talk : ICONS.cmd;
    for (const row of menu.children) {
        row.classList.toggle("on", row.dataset.id === mode.id);
    }
};

const closeMenu = () => {
    menu.classList.remove("open");
    modeBtn.classList.remove("open");
};

/* A mode chosen: the words already written stay, after the command (or alone, for "Falar"). */
const pickMode = (id) => {
    const rest = input.value.replace(/^\/[A-Za-zÀ-ÿ]+\s*/, "");
    input.value = id === "" ? rest : id + " " + rest;
    closeMenu();
    input.focus();
    showMode();
};

for (const mode of MODES) {
    const row = document.createElement("button");
    row.type = "button";
    row.dataset.id = mode.id;
    const cmd = document.createElement("span");
    cmd.className = "cmd";
    cmd.textContent = mode.label;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = mode.hint;
    row.appendChild(cmd);
    row.appendChild(hint);
    row.addEventListener("mousedown", (event) => event.preventDefault());
    row.addEventListener("click", () => pickMode(mode.id));
    menu.appendChild(row);
}

modeBtn.addEventListener("mousedown", (event) => event.preventDefault());
modeBtn.addEventListener("click", () => {
    const wasOpen = menu.classList.contains("open");
    closeMenu();
    if (!wasOpen) {
        menu.classList.add("open");
        modeBtn.classList.add("open");
        showMode();
    }
    input.focus();
});
document.addEventListener("mousedown", (event) => {
    if (!event.target.closest || !event.target.closest(".mode")) {
        closeMenu();
    }
});

/* The size of everything follows the width of the view, which the client makes from the size of the screen. */
const fit = () => {
    document.documentElement.style.fontSize = Math.max(13, Math.min(19, window.innerWidth / 34)) + "px";
};

/* A chat colour is packed 0xRRGGBBAA; it tints the rule at the line's side, and the words stay legible on the plate. */
const tint = (color) => {
    if (typeof color !== "number" || !Number.isFinite(color) || color === 0) {
        return "";
    }
    const packed = color >>> 0;
    return "rgb(" + ((packed >>> 24) & 255) + "," + ((packed >>> 16) & 255) + "," + ((packed >>> 8) & 255) + ")";
};

const stick = () => {
    log.scrollTop = log.scrollHeight;
};

const addLine = (message) => {
    if (typeof message !== "object" || message === null || typeof message.text !== "string" || message.text === "") {
        return;
    }
    const author = typeof message.author === "string" ? message.author : "";
    const row = document.createElement("div");
    row.className = author === "" ? "line sys" : "line";
    const color = tint(message.color);
    if (color !== "") {
        row.style.setProperty("--tint", color);
    }
    if (author !== "") {
        const who = document.createElement("b");
        who.className = "who";
        who.textContent = author;
        row.appendChild(who);
    }
    const words = document.createElement("span");
    words.textContent = message.text;
    row.appendChild(words);
    row.dataset.at = String(Date.now());
    log.appendChild(row);
    while (log.childElementCount > KEEP) {
        log.removeChild(log.firstElementChild);
    }
    stick();
};

/* Shut, a line goes after FADE_MS; open, every line is there. */
const fade = () => {
    const now = Date.now();
    for (const row of log.children) {
        if (open) {
            row.classList.remove("gone", "off");
            continue;
        }
        const age = now - Number(row.dataset.at || 0);
        if (age > FADE_MS) {
            row.classList.add("gone");
        }
        if (age > FADE_MS + 1500) {
            row.classList.add("off");
        }
    }
};

const setOpen = (value) => {
    if (open === value) {
        return;
    }
    open = value;
    document.body.classList.toggle("open", value);
    closeMenu();
    if (value) {
        openedAt = Date.now();
        input.value = "";
        showMode();
        recalled = history.length;
        fade();
        stick();
        input.focus();
        // The card changes size as it opens, and the font may still be arriving: the log is put at its foot again a moment later.
        setTimeout(() => {
            input.focus();
            stick();
        }, 60);
    } else {
        input.blur();
        // What was on show goes soon, not at once.
        const grace = Date.now() - FADE_MS + 3000;
        for (const row of log.children) {
            row.dataset.at = String(Math.min(Number(row.dataset.at || 0), grace));
        }
    }
};

const recall = (step) => {
    if (history.length === 0) {
        return;
    }
    recalled = Math.max(0, Math.min(history.length, recalled + step));
    input.value = recalled === history.length ? "" : history[recalled];
    showMode();
};

const submit = () => {
    const text = input.value.trim();
    input.value = "";
    if (text === "") {
        setOpen(false);
        send("chat:close");
        return;
    }
    // A command chosen from the menu and sent with no words ("/me") goes as it is: the server answers with the way to write it.
    if (history[history.length - 1] !== text) {
        history.push(text);
        if (history.length > HISTORY) {
            history.shift();
        }
    }
    setOpen(false);
    send("chat:submit", { text });
};

/* The key by what the game's browser is sure to fill in: its number (`keyCode`), as the free camera page does. */
input.addEventListener("keydown", (event) => {
    const code = event.keyCode || 0;
    if (code === 13 || event.key === "Enter") {
        event.preventDefault();
        submit();
    } else if (code === 27 || event.key === "Escape") {
        event.preventDefault();
        if (menu.classList.contains("open")) {
            closeMenu();
            return;
        }
        setOpen(false);
        send("chat:close");
    } else if (code === 38 || event.key === "ArrowUp") {
        event.preventDefault();
        recall(-1);
    } else if (code === 40 || event.key === "ArrowDown") {
        event.preventDefault();
        recall(1);
    }
});

/* The T that opened the line may reach it too: a lone "t" in the first instants is not the player's. */
input.addEventListener("input", () => {
    if (Date.now() - openedAt < 160 && /^[tT]$/.test(input.value)) {
        input.value = "";
    }
    showMode();
});

window.addEventListener("chat:line", (event) => addLine(event.detail));
window.addEventListener("chat:open", () => setOpen(true));
window.addEventListener("chat:shut", () => setOpen(false));
window.addEventListener("resize", fit);

fit();
showMode();
setInterval(fade, 500);
send("chat:ready");
</script>
</body>
</html>
