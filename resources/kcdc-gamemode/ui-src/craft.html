<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kingdom RP BRASIL - Ofício</title>
<style>
    /* A trade's page (src/client/craft-page.ts): on the right, like the character creator's; the recipes of the trade in pages,
       what the chosen one takes and how much of it the player has, and the work. The game's own item icons are drawn by the
       client in the slots (src/client/craft-icons.ts): the page leaves each slot's middle see-through once it is told the icons
       are up, and puts a sign of the recipe's kind there until then. */
    @font-face {
        font-family: "Cinzel";
        src: url("fonts/cinzel.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
    }

    :root {
        --btn: rgba(124, 3, 5, 0.992);
        --btn-hi: rgb(152, 9, 12);
        --bg: rgba(210, 179, 140, 0.992);
        --ink: rgba(32, 27, 23, 0.99);
        --ink-2: rgba(32, 27, 23, .66);
        --rule: rgba(32, 27, 23, .30);
        --rule-soft: rgba(32, 27, 23, .15);
        --good: #2f5a22;
        --display: "Cinzel", "Palatino Linotype", Georgia, serif;
        --body: "Constantia", "Sitka Text", Georgia, "Palatino Linotype", serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font: 1rem/1.45 var(--body); color: var(--ink); user-select: none; font-variant-numeric: lining-nums; }
    img { display: block; -webkit-user-drag: none; }
    [hidden] { display: none !important; }
    input { user-select: text; font-family: var(--body); color: var(--ink); }
    button { font-family: var(--display); color: inherit; cursor: pointer; background: none; border: 0; }
    button, button:focus, input:focus { outline: none; }

    .stage { position: fixed; inset: 0; animation: open .3s ease both; }
    @keyframes open { from { opacity: 0; } to { opacity: 1; } }

    .panel { position: absolute; right: 1rem; top: 2.2rem; bottom: 2.2rem; width: 36rem; display: flex; flex-direction: column; padding: 1.4rem 2.2rem 1.2rem; border: 1px solid var(--rule); box-shadow: 0 0 0 .45rem rgba(210, 179, 140, .22), 0 1.4rem 3.4rem rgba(30, 18, 6, .6); }
    /* The paper is a layer of its own, so that the slots can be cut out of it when the icons are drawn under the page. */
    .panel > .paper { position: absolute; inset: 0; pointer-events: none; }
    .paper > .layer { position: absolute; inset: 0; }
    .base { background: var(--bg); }
    .photo { background: url("img/bg-hud.webp") center / cover no-repeat; opacity: .22; mix-blend-mode: multiply; }
    .grain { background: url("img/paper.svg"); mix-blend-mode: multiply; }
    .sheen { background: radial-gradient(ellipse 80% 55% at 24% 12%, rgba(255, 244, 214, .5), transparent 72%); }
    .inner { position: absolute; inset: .55rem; border: 1px solid var(--rule); pointer-events: none; }
    .orn { position: absolute; width: 7.4rem; height: auto; pointer-events: none; z-index: 3; filter: drop-shadow(0 .3rem .5rem rgba(20, 12, 4, .4)); }
    .orn-tl { top: -.8rem; left: -.8rem; }
    .orn-br { right: -.8rem; bottom: -.8rem; }
    .panel > * { position: relative; }
    .panel > .paper, .panel > .inner, .panel > .orn { position: absolute; }

    .close { position: absolute; top: 1.3rem; right: 1.4rem; z-index: 5; display: grid; place-items: center; width: 2.2rem; height: 2.2rem; background: var(--btn); border: 1px solid rgba(0, 0, 0, .4); }
    .close svg { width: .9rem; height: .9rem; stroke: var(--bg); stroke-width: 2.2; stroke-linecap: square; }
    .close:hover { background: var(--btn-hi); }

    .head { padding-left: 3.2rem; }
    .head-title { height: 3.6rem; width: auto; }
    .head h1 { font: 700 2rem/1.1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
    .head .bar { display: flex; margin-top: .5rem; }
    .head .bar i { display: block; height: 2px; }
    .head .bar i:first-child { width: 2.6rem; background: var(--btn-hi); }
    .head .bar i:last-child { flex: 1; margin-left: .3rem; background: var(--rule); }
    .head p { margin-top: .4rem; font: italic 1rem/1.3 var(--body); color: var(--ink-2); }

    /* The tabs of the forge's and the needle's page (2026-10-27): the recipes, or the pieces to break apart. */
    .modes { display: flex; gap: 1.6rem; margin-top: .75rem; padding-left: 3.2rem; border-bottom: 1px solid var(--rule); }
    .modes[hidden] { display: none; }
    .modes button { margin-bottom: -1px; padding: .15rem 0 .45rem; font: 600 .72rem/1 var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--ink-2); border-bottom: 2px solid transparent; }
    .modes button:hover:not(:disabled) { color: var(--ink); }
    .modes button.on { color: var(--ink); border-bottom-color: var(--btn); }
    .modes button:disabled { cursor: default; }

    .tools { display: flex; gap: .5rem; margin-top: .8rem; }
    /* The categories: a list drawn by the page, like the panel's (2026-10-18: one list, not a wall of chips; the browser's own
       <select> opens outside the page, in the game's blue). */
    .dd { position: relative; flex: 1; min-width: 0; }
    .dd-btn { display: flex; align-items: center; gap: .8rem; width: 100%; height: 1.9rem; padding: 0 .9rem 0 .7rem; font: .95rem var(--body); text-align: left; background: rgba(255, 247, 226, .3); border: 1px solid var(--rule); transition: border-color .15s, background .15s; }
    .dd-btn:hover { border-color: rgba(32, 27, 23, .55); background: rgba(255, 247, 226, .4); }
    .dd.open .dd-btn { border-color: var(--btn); background: rgba(255, 247, 226, .5); }
    .dd-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd-arrow { flex: none; width: .45rem; height: .45rem; margin-top: -.25rem; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); transition: transform .15s, margin .15s; }
    .dd.open .dd-arrow { margin-top: .2rem; transform: rotate(-135deg); border-color: var(--btn); }
    .dd-list { position: absolute; z-index: 20; top: calc(100% + .3rem); left: 0; right: 0; max-height: 21rem; overflow-y: auto; padding: .4rem; background: var(--bg); border: 1px solid var(--ink); box-shadow: 0 .9rem 2rem rgba(20, 12, 4, .4); animation: drop .14s ease both; overscroll-behavior: contain; }
    @keyframes drop { from { opacity: 0; transform: translateY(-.3rem); } to { opacity: 1; transform: none; } }
    /* The panel's gilded scroll bar, on the lists of this page too. */
    *::-webkit-scrollbar { width: .7rem; }
    *::-webkit-scrollbar-track { background: linear-gradient(90deg, transparent 38%, rgba(32, 27, 23, .16) 38%, rgba(32, 27, 23, .16) 62%, transparent 62%); }
    *::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #cfa95f, #8a6a2c); background-clip: padding-box; border: 2px solid transparent; border-radius: .5rem; box-shadow: inset 0 0 0 1px rgba(70, 45, 10, .5); }
    *::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #e0bb73, var(--btn)); background-clip: padding-box; }
    /* The drawing of a category (2026-10-25: "nas opções de filtro das receitas vamos usar o padrão dos ícones que usamos"): a line drawing in the ink's colour, like the panel's. */
    .dd-ico { flex: none; display: inline-flex; width: 1.2rem; height: 1.2rem; color: var(--ink-2); }
    .dd-ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .dd-btn .dd-ico { color: var(--ink); }
    /* The option's own `span` rule (a label that takes the room) is not for the drawing. */
    .dd-opt .dd-ico { flex: none; overflow: visible; align-self: center; }
    .dd-opt:hover .dd-ico { color: var(--ink); }
    .dd-opt.on .dd-ico { color: var(--btn); }
    .dd-head { padding: .55rem .75rem .2rem; font: 600 .66rem/1.2 var(--display); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-2); border-top: 1px solid var(--rule-soft); }
    .dd-head:first-of-type { border-top: 0; }
    .dd-opt { display: flex; align-items: baseline; gap: .6rem; width: 100%; padding: .5rem .7rem .5rem .75rem; font: .97rem/1.3 var(--body); text-align: left; border-left: 3px solid transparent; transition: background .12s; }
    .dd-opt span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd-opt small { flex: none; font: italic .85rem var(--body); color: var(--ink-2); }
    .dd-opt:hover { background: rgba(213, 161, 86, .24); }
    .dd-opt.on { font-weight: 600; border-left-color: var(--btn); background: rgba(255, 247, 226, .5); }
    .q { width: 10rem; height: 1.9rem; padding: 0 .5rem; font-size: .95rem; background: rgba(255, 247, 226, .42); border: 1px solid var(--rule); }
    .q:focus { border-color: var(--btn); }

    .list { flex: 1; min-height: 0; margin-top: .7rem; display: flex; flex-direction: column; gap: .25rem; overflow: hidden; }
    .rrow { display: flex; align-items: center; gap: .65rem; width: 100%; min-height: 2.9rem; padding: .2rem .5rem; text-align: left; border: 1px solid transparent; font-family: var(--body); }
    .rrow:hover { background: rgba(213, 161, 86, .16); border-color: var(--rule-soft); }
    .rrow.on { background: rgba(124, 3, 5, .1); border-color: rgba(124, 3, 5, .45); }
    .rrow .nm { flex: 1; min-width: 0; font: 600 1rem/1.15 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rrow .nm small { display: block; font: italic .82rem/1.1 var(--body); color: var(--ink-2); }
    .rrow .st { flex: none; font: 600 .66rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; padding: .25rem .4rem; border: 1px solid currentColor; }
    .st.ok { color: var(--good); }
    .st.miss { color: var(--ink-2); }
    .st.lock { color: var(--btn-hi); }
    .rrow.locked .nm { opacity: .55; }

    .pager { display: flex; align-items: center; justify-content: center; gap: .9rem; margin-top: .35rem; font: 600 .8rem/1 var(--display); letter-spacing: .12em; }
    .pager button { width: 1.9rem; height: 1.6rem; border: 1px solid var(--rule); font-size: 1rem; }
    .pager button:hover:not(:disabled) { background: var(--btn); color: var(--bg); }
    .pager button:disabled { opacity: .3; cursor: default; }

    .detail { flex: none; margin-top: .7rem; padding-top: .7rem; border-top: 1px solid var(--rule); min-height: 13.5rem; }
    .dhead { display: flex; align-items: center; gap: .8rem; }
    .dhead b { display: block; font: 700 1.25rem/1.15 var(--display); letter-spacing: .05em; }
    .dhead span.sub { display: block; font: italic .92rem/1.2 var(--body); color: var(--ink-2); }
    .k { margin: .65rem 0 .3rem; font: 600 .68rem/1.2 var(--display); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-2); }
    .ings { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .8rem; }
    .ings li { display: flex; align-items: center; gap: .5rem; min-width: 0; }
    .ings .in { flex: 1; min-width: 0; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ings .ic { flex: none; font: 600 .9rem/1 var(--display); }
    .ic.ok { color: var(--good); }
    .ic.bad { color: var(--btn-hi); }
    .facts { margin-top: .55rem; font: italic .92rem/1.3 var(--body); color: var(--ink-2); }
    .effect { margin: .3rem 0 .8rem; font: .98rem/1.38 var(--body); color: var(--ink); }
    .facts .lock { color: var(--btn-hi); font-style: normal; font-weight: 600; }
    .work { display: flex; align-items: center; gap: .7rem; margin-top: .7rem; }
    /* How many at once (2026-10-27): a small stepper before the button, from one up to what the bag allows (ten at most). */
    .qty { display: inline-flex; align-items: stretch; height: 2.25rem; border: 1px solid var(--rule); background: rgba(255, 247, 226, .35); }
    .qty button { min-width: 1.9rem; padding: 0 .5rem; font: 600 1.05rem/1 var(--display); }
    .qty button:hover:not(:disabled) { background: var(--btn); color: var(--bg); }
    .qty button:disabled { opacity: .3; cursor: default; }
    .qty b { min-width: 2.2rem; display: grid; place-items: center; font: 600 .95rem/1 var(--display); border-left: 1px solid var(--rule-soft); border-right: 1px solid var(--rule-soft); }
    .qty .max { border-left: 1px solid var(--rule); font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; }
    .btn { padding: .65rem 1.4rem; background: var(--btn); color: var(--bg); border: 1px solid rgba(0, 0, 0, .4); font: 600 .82rem/1 var(--display); letter-spacing: .18em; text-transform: uppercase; }
    .btn:hover:not(:disabled) { background: var(--btn-hi); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
    .prog { flex: 1; position: relative; height: 1.9rem; border: 1px solid var(--rule); background: rgba(255, 247, 226, .35); overflow: hidden; }
    .prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(124, 3, 5, .28); }
    .prog span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 .74rem/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
    .msg { min-height: 1.3rem; margin-top: .45rem; font: italic .92rem/1.3 var(--body); color: var(--ink-2); }
    .msg.bad { color: var(--btn-hi); font-style: normal; font-weight: 600; }
    .msg.good { color: var(--good); font-style: normal; font-weight: 600; }
    .empty { margin-top: 1rem; font: italic 1rem/1.4 var(--body); color: var(--ink-2); text-align: center; }

    /* A slot: a framed square the client draws the game's icon in. Until it is told the icons are up, a sign of the kind. */
    .slot { flex: none; position: relative; display: grid; place-items: center; border: 1px solid rgba(32, 27, 23, .45); background: rgba(32, 27, 23, .78); box-shadow: inset 0 0 0 1px rgba(213, 161, 86, .35); }
    .slot svg { width: 60%; height: 60%; fill: none; stroke: rgba(243, 230, 200, .75); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    body.icons .slot { background: transparent; border-color: rgba(32, 27, 23, .22); box-shadow: none; }
    body.icons .slot svg { display: none; }
    .s48 { width: 2.5rem; height: 2.5rem; }
    .s64 { width: 3.6rem; height: 3.6rem; }
    .s32 { width: 1.9rem; height: 1.9rem; }

    /* The colour of a garment (2026-10-31): a row in the detail with the dye picked, and a little square, in place of the list while it is open, with every dye by its icon. */
    .dye { display: flex; align-items: center; gap: .7rem; margin-top: .55rem; }
    .dye .k { margin: 0; }
    .dyebtn { display: flex; align-items: center; gap: .6rem; height: 2.4rem; padding: 0 .85rem 0 .25rem; font: .97rem var(--body); background: rgba(255, 247, 226, .3); border: 1px solid var(--rule); }
    .dyebtn:hover { border-color: rgba(32, 27, 23, .55); background: rgba(255, 247, 226, .45); }
    .dyebtn .dd-arrow { margin-top: -.25rem; }
    .dyebtn small { font: italic .8rem var(--body); color: var(--btn-hi); }
    .panel.picking .tools, .panel.picking .list, .panel.picking .pager, .panel.picking .detail { display: none; }
    .vpop { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: .8rem; }
    .vpop[hidden] { display: none; }
    .vhead { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding-bottom: .55rem; border-bottom: 1px solid var(--rule); }
    .vhead b { display: block; font: 700 1.15rem/1.15 var(--display); letter-spacing: .05em; }
    .vhead span.sub { display: block; font: italic .92rem/1.2 var(--body); color: var(--ink-2); }
    .vgrid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(5.6rem, 1fr)); gap: .55rem .45rem; align-content: start; padding: .7rem .3rem .3rem 0; overscroll-behavior: contain; }
    .vtile { display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .5rem .25rem .45rem; border: 1px solid var(--rule-soft); font-family: var(--body); }
    .vtile:hover { background: rgba(213, 161, 86, .16); border-color: var(--rule); }
    .vtile.on { border-color: rgba(124, 3, 5, .6); background: rgba(124, 3, 5, .1); }
    .vtile .vl { max-width: 100%; font: .82rem/1.15 var(--body); text-align: center; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .vtile small { font: 600 .58rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
    .vtile.rich small { color: var(--btn-hi); }
    .vtile.no .vl { opacity: .55; }

    /* The trade between two players (2026-10-18): both offers on the page, each item with the game's icon. */
    .panel.trading .tools, .panel.trading .list, .panel.trading .pager, .panel.trading .detail { display: none; }
    .trade { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: .8rem; }
    .trade[hidden] { display: none; }
    .offers { flex: 1; min-height: 0; overflow-y: auto; padding-right: .3rem; }
    .offer { padding: .7rem .85rem .8rem; background: rgba(255, 247, 226, .18); border: 1px solid var(--rule); }
    .offer + .offer { margin-top: .7rem; }
    .offer.agreed { border-color: rgba(47, 90, 34, .7); box-shadow: inset 0 0 0 1px rgba(47, 90, 34, .45); }
    .ohead { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; }
    .ohead b { font: 600 .74rem/1.2 var(--display); letter-spacing: .22em; text-transform: uppercase; }
    .ohead span { font: italic .9rem/1.2 var(--body); color: var(--ink-2); }
    .ohead span.yes { color: var(--good); font-style: normal; font-weight: 600; }
    .ogrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem .35rem; margin-top: .6rem; }
    .oitem { display: flex; flex-direction: column; align-items: center; gap: .25rem; min-width: 0; text-align: center; }
    .oitem .on { max-width: 100%; font: .78rem/1.15 var(--body); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .oitem .slot { position: relative; }
    .oitem .cnt { font: 600 .8rem/1 var(--display); }
    .onone { margin-top: .55rem; font: italic .95rem/1.3 var(--body); color: var(--ink-2); }
    .tfoot { display: flex; flex-wrap: wrap; gap: .55rem; padding-top: .75rem; margin-top: .6rem; border-top: 1px solid var(--rule); }
    .tfoot .btn { padding: .65rem .85rem; letter-spacing: .14em; }
    .tfoot .btn.go { flex: 1; }
</style>
</head>
<body>
<div class="stage">
    <aside class="panel" id="panel">
        <div class="paper" id="paper"><div class="layer base"></div><div class="layer photo"></div><div class="layer grain"></div><div class="layer sheen"></div></div>
        <div class="inner"></div>
        <img class="orn orn-tl" src="img/frame-corner-tl.webp" alt="">
        <img class="orn orn-br" src="img/frame-corner-br.webp" alt="">
        <button class="close" id="close" title="Sair (Esc)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4l16 16M20 4L4 20"/></svg></button>

        <header class="head">
            <img class="head-title" id="titleImg" alt="" hidden>
            <h1 id="title">Ofício</h1>
            <div class="bar"><i></i><i></i></div>
            <p id="sub"></p>
        </header>

        <nav class="modes" id="modes" hidden></nav>

        <div class="tools">
            <div class="dd" id="cats"><button class="dd-btn" id="catBtn"><span class="dd-ico" id="catIc"></span><span class="dd-val" id="catVal">Todas as categorias</span><i class="dd-arrow"></i></button></div>
            <input class="q" id="q" type="text" maxlength="40" spellcheck="false" autocomplete="off" placeholder="Procurar">
        </div>

        <section class="list" id="list"></section>
        <div class="pager"><button id="prev">&lsaquo;</button><span id="pageno">1 / 1</span><button id="next">&rsaquo;</button></div>

        <section class="detail" id="detail"></section>
        <section class="vpop" id="vpop" hidden></section>
        <section class="trade" id="trade" hidden></section>
    </aside>
</div>

<script>
"use strict";

const send = (name, payload) => {
    if (typeof callEvent === "function") {
        callEvent(name, payload === undefined ? null : JSON.stringify(payload));
    }
};
const $ = (id) => document.getElementById(id);
const make = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) {
        el.className = cls;
    }
    if (text !== undefined && text !== null) {
        el.textContent = text;
    }
    return el;
};

const SKILLS = { survival: "Sobrevivência", alchemy: "Alquimia", craftsmanship: "Ofício", drinking: "Bebida" };
/* The trades' title images, sent by the server with the page when it opens (they do not fit in the client package), kept per trade. */
const titles = {};
const SIGNS = {
    food: '<svg viewBox="0 0 24 24"><path d="M4 13h16a8 8 0 0 1-16 0Z"/><path d="M9 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg>',
    metal: '<svg viewBox="0 0 24 24"><path d="M4 20 15 9M14 4l6 6-3 3-6-6Z"/></svg>',
    cloth: '<svg viewBox="0 0 24 24"><path d="M8.2 3.6 12 5.6l3.8-2 4.8 3.6-2.2 3.4-2-1.2v11H7.6v-11l-2 1.2-2.2-3.4Z"/></svg>',
    potion: '<svg viewBox="0 0 24 24"><path d="M10 3h4M10.5 3v5L6 16a3 3 0 0 0 2.6 4.5h6.8A3 3 0 0 0 18 16l-4.5-8V3"/></svg>',
    /* The gardens' page (2026-10-22): a sprout with two leaves. */
    leaf: '<svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12C12 7.5 8.6 5 4.5 5c0 4.4 3 7 7.5 7Z"/><path d="M12 14.5c0-3.6 2.8-5.8 7-5.8 0 3.8-2.6 5.8-7 5.8Z"/></svg>',
};
const SIGN_OF = { fogo: "food", defumador: "food", secador: "food", forja: "metal", costura: "cloth", alquimia: "potion", horta: "leaf", reparo: "metal" };

let view = null;
let cat = "";
let query = "";
let page = 0;
let picked = "";
let busy = null;
/* How many of a row are asked for at once (2026-10-27); kept from row to row, and held to what the bag allows for the one shown. */
let qty = 1;
const MAX_BATCH = 10;
/* How many of a row the bag has the ingredients for, up to ten: a tool is looked for and not used up. */
const maxQty = (r) => {
    let most = MAX_BATCH;
    for (const [, need, have, tool] of r.ing) {
        if (!tool && need > 0 && r.qmax === undefined) most = Math.min(most, Math.floor(have / need));
    }
    /* Work paid with the body's own water (2026-10-30): the server says how many pieces the body can pay now. */
    if (r.th) most = Math.min(most, r.th[1]);
    /* The extraction (2026-10-31): the units of the stack that may be taken apart at once, up to ten. */
    if (r.qmax !== undefined) most = Math.min(most, r.qmax);
    return most;
};
/* The number shown and asked for: one on a row that is not made on the page or cannot be made now. */
const quantityOf = (r) => (r.batch && r.can && !r.lock ? Math.max(1, Math.min(qty, maxQty(r))) : 1);

/* The paper's colour under a slot, as its layers make it (the base, the photo multiplied in at .22, the grain, the sheen): the game
   fills the back of each icon with it, so what an icon leaves see-through looks like the page around it, not a dark square. */
const BASE = [210, 179, 140];
const GRAIN = [0.93, 0.919, 0.902];
const SHEEN = [255, 244, 214];
let photo = null;
const photoImg = new Image();
photoImg.onload = () => {
    try {
        const c = document.createElement("canvas");
        c.width = 96;
        c.height = Math.max(1, Math.round((96 * photoImg.naturalHeight) / photoImg.naturalWidth));
        const g = c.getContext("2d");
        g.imageSmoothingQuality = "high";
        g.drawImage(photoImg, 0, 0, c.width, c.height);
        photo = { w: c.width, h: c.height, d: g.getImageData(0, 0, c.width, c.height).data };
    } catch (e) {
        photo = null;
    }
    reportSlots();
};
photoImg.src = "img/bg-hud.webp";
/* x, y: the slot's middle in the paper's box; size: its side. The photo is read over the whole slot. */
const paperAt = (x, y, box, size) => {
    let p = [255, 255, 255];
    if (photo) {
        const s = Math.max(box.width / photo.w, box.height / photo.h);
        p = [0, 0, 0];
        for (const dx of [-1, 0, 1]) {
            for (const dy of [-1, 0, 1]) {
                const px = Math.min(photo.w - 1, Math.max(0, Math.floor((x + (dx * size) / 3 - (box.width - photo.w * s) / 2) / s)));
                const py = Math.min(photo.h - 1, Math.max(0, Math.floor((y + (dy * size) / 3 - (box.height - photo.h * s) / 2) / s)));
                const i = (py * photo.w + px) * 4;
                for (let k = 0; k < 3; k++) {
                    p[k] += photo.d[i + k] / 9;
                }
            }
        }
    }
    const a = 0.5 * Math.max(0, 1 - Math.hypot((x - 0.24 * box.width) / (0.8 * box.width), (y - 0.12 * box.height) / (0.55 * box.height)) / 0.72);
    let rgb = 0;
    for (let k = 0; k < 3; k++) {
        const c = BASE[k] * (1 - 0.22 * (1 - p[k] / 255)) * GRAIN[k];
        rgb = rgb * 256 + Math.round(c * (1 - a) + SHEEN[k] * a);
    }
    return rgb;
};

/* The page scales with the screen, times the player's own choice (Opções, Resolução da interface, told by the client as ui:scale). */
let uiScale = 1;
const fit = () => {
    const scale = Math.max(0.5, Math.min(window.innerWidth / 1920, window.innerHeight / 1080)) * uiScale;
    document.documentElement.style.fontSize = (16 * scale).toFixed(3) + "px";
};
window.addEventListener("ui:scale", (event) => {
    const scale = Number(event.detail && event.detail.scale);
    if (!(scale >= 0.5 && scale <= 2) || scale === uiScale) return;
    uiScale = scale;
    window.dispatchEvent(new Event("resize"));
});

const nameOf = (id) => (view && view.items[id] ? view.items[id][0] : id);
const iconOf = (id) => (view && view.items[id] ? view.items[id][1] : "");

/* A slot for an icon of the game's: the client draws it in the square (see reportSlots). */
const slotFor = (icon, size) => {
    const el = make("span", "slot " + size);
    el.dataset.icon = icon;
    el.innerHTML = SIGNS[SIGN_OF[view.station]] || "";
    return el;
};
/* A slot for an item: its own icon. */
const slot = (id, size) => slotFor(iconOf(id), size);

/* The dyes of a garment, and the colours of a piece of the forge since 2026-11-03 (2026-10-31): `r.vs` is [colour, icon, 0 anybody's / 1 a noble's / 2 a noble's this worker may not make] for each; the one picked is kept for the recipe. */
let dyeOf = {};
const dyeAt = (r) => (r.vs ? Math.min(dyeOf[r.id] | 0, r.vs.length - 1) : 0);
const dyeOut = (r) => (r.vs ? r.vs[dyeAt(r)] : null);
const dyeBarred = (r) => !!(r.vs && r.vs[dyeAt(r)][2] === 2);
const capital = (word) => word.charAt(0).toUpperCase() + word.slice(1);
/* The icon of a recipe: the dye picked, or the item's own. */
const iconSlot = (r, size) => (r.vs ? slotFor(r.vs[dyeAt(r)][1], size) : slot(r.out, size));

const filtered = () => {
    const q = query.trim().toLowerCase();
    const rows = view.recipes.filter((r) => (cat === "" || r.cat === cat) && (q === "" || nameOf(r.out).toLowerCase().includes(q) || (r.vs && r.vs.some((v) => v[0].includes(q)))));
    /* All the categories at once: in the order of the dropdown (the groups), not the alphabet; inside a category, as the server sent them (by level). */
    if (cat === "" && CAT_GROUPS[view.station]) {
        const counts = {};
        for (const r of view.recipes) counts[r.cat] = 1;
        const rank = {};
        groupedCats(counts).forEach(([, c], i) => (rank[c] = i));
        return rows.map((r, i) => [r, i]).sort((a, b) => rank[a[0].cat] - rank[b[0].cat] || a[1] - b[1]).map((pair) => pair[0]);
    }
    return rows;
};

/* How many rows fit in the list as it is drawn now. */
const perPage = () => {
    const list = $("list");
    const row = 3.05 * parseFloat(getComputedStyle(document.documentElement).fontSize);
    return Math.max(3, Math.floor(list.clientHeight / row));
};

/* The icon of a category: its own drawing, the tag for one that has none; the repair kits of the forge are a wrench and the tailor's a spool of thread, and a house's coats
   of arms ("Brasão: Leipa", one category for each house) are a tunic with a shield. */
const catIcon = (value) => {
    /* A town's own pieces (2026-10-31) stand under "<town> · <kind>": the drawing is the kind's. */
    const tail = value.indexOf(" \u00b7 ") > 0 ? value.slice(value.indexOf(" \u00b7 ") + 3) : value;
    const key = value === "Kits de reparo" && view.station === "costura" ? "spool" : CAT_KEY[value] || CAT_KEY[tail] || (value.indexOf("Brasão: ") === 0 ? "crest" : "tag");

const CAT_GROUPS = {

        ["Armaduras de pano e couro", ["Gibões e jaquetões", "Brigandinas", "Almofres e coifas", "Mangas de brigandina", "Calças acolchoadas", "Perneiras de brigandina"]],

        ["Fios", ["Fios"]],

/* [group heading, category] for each category of the trade, in order. */
const groupedCats = (counts) => {
    const groups = CAT_GROUPS[view.station];
    if (!groups) {
        return Object.keys(counts).sort().map((c) => ["", c]);
    }
    const left = new Set(Object.keys(counts));
    const out = [];
    const take = (heading, name) => {
        const names = name === "Brasão: *" ? [...left].filter((c) => c.indexOf("Brasão: ") === 0).sort() : left.has(name) ? [name] : [];
        for (const c of names) {
            left.delete(c);
            out.push([heading, c]);
        }
    };
    for (const [heading, names] of groups) {
        for (const name of names) {
            take(heading, name);
        }
    }
    for (const c of [...left].sort()) {
        out.push(["Outros", c]);
    }
    return out;
};
const catOptions = () => {
    const counts = {};
    for (const r of view.recipes) {
        counts[r.cat] = (counts[r.cat] || 0) + 1;

    return [["", "Todas as categorias", view.recipes.length], ...groupedCats(counts).map(([heading, c]) => [c, c, counts[c], heading])];

/* The game's browser does not always move a list that lies over the page with the wheel (2026-10-19: "o scroll no ng select das
   listas"): the list moves itself, a line at a time, and the page behind it stays where it is. */
function wheelScroll(list) {
    list.addEventListener("wheel", (event) => {
        if (list.scrollHeight <= list.clientHeight + 1) return;
        event.preventDefault();
        event.stopPropagation();
        list.scrollTop += event.deltaMode === 1 ? event.deltaY * 32 : event.deltaMode === 2 ? event.deltaY * list.clientHeight : event.deltaY;
    }, { passive: false });
}

/* The slots cut out of the paper while the icons are up, so they show whether the game draws them under the page or over it. */
const cutSlots = (rects) => {
    const paper = $("paper");
    if (!iconsOn || rects.length === 0) {
        paper.style.webkitMaskImage = "";
        return;
    }
    const box = paper.getBoundingClientRect();
    const images = [];
    const places = [];
    const sizes = [];
    const ops = [];
    for (const r of rects) {
        images.push("linear-gradient(#000,#000)");
        places.push((r.left - box.left + 1).toFixed(1) + "px " + (r.top - box.top + 1).toFixed(1) + "px");
        sizes.push((r.width - 2).toFixed(1) + "px " + (r.height - 2).toFixed(1) + "px");
        ops.push("xor");
    }
    images.push("linear-gradient(#000,#000)");
    places.push("0 0");
    sizes.push("100% 100%");
    ops.push("source-over");
    paper.style.webkitMaskImage = images.join(",");
    paper.style.webkitMaskPosition = places.join(",");
    paper.style.webkitMaskSize = sizes.join(",");
    paper.style.webkitMaskRepeat = "no-repeat";
    paper.style.webkitMaskComposite = ops.join(",");
};

/* Where each slot is on the screen, as shares of it, with the icon it shows: the client draws the game's icons there. Sent when
   they change; the page can still move after it is drawn (its fonts arriving), so they are looked at again now and then. */
let slotsFrame = 0;
let lastSlots = "";
const reportSlots = () => {
    cancelAnimationFrame(slotsFrame);
    slotsFrame = requestAnimationFrame(() => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const box = $("paper").getBoundingClientRect();
        const slots = [];
        const rects = [];
        for (const el of catList ? [] : document.querySelectorAll(picking ? ".vpop .slot" : ".slot")) {
            const r = el.getBoundingClientRect();
            if (r.width > 0 && el.dataset.icon) {
                rects.push(r);
                slots.push({ icon: el.dataset.icon, x: r.left / w, y: r.top / h, w: r.width / w, h: r.height / h, bg: paperAt(r.left - box.left + r.width / 2, r.top - box.top + r.height / 2, box, r.width) });
            }
        }
        cutSlots(rects);
        const said = JSON.stringify(slots);
        if (said !== lastSlots) {
            lastSlots = said;
            send("craft:slots", { slots });
        }
    });
};

/* The words of the last result: the page comes again right after them, and the detail it draws is a new one (2026-11-03). */
let lastSaid = null;
const say = (text, kind) => {

/* The page's title: the image the server sent for `key` (kept for the next time), else the name in text until it has loaded. The
   trade's title and the trades' share the one image: one coming back finds the other's hidden, so an image already loaded is
   shown again at once. */
const showTitle = (key, sent, text) => {
    const img = $("titleImg");
    if (sent) {
        titles[key] = sent;
    }
    const src = titles[key] || "";
    img.alt = text;
    $("title").textContent = text;
    img.onerror = () => {
        img.hidden = true;
        $("title").hidden = false;
    };
    img.onload = () => {
        img.hidden = false;
        $("title").hidden = true;
    };
    if (src === "") {
        img.hidden = true;
        $("title").hidden = false;
        return;
    }
    if (img.getAttribute("src") === src) {
        if (img.complete && img.naturalWidth > 0) {
            img.hidden = false;
            $("title").hidden = true;
        }
        return;
    }
    img.hidden = true;
    $("title").hidden = false;
    img.src = src;
};

/* The tabs, when the view brings them: [mode, label] pairs; a click asks the server for the other list (not while a piece of work goes on). */
const drawModes = () => {
    const host = $("modes");
    host.replaceChildren();
    host.hidden = !Array.isArray(view.modes);
    if (host.hidden) return;
    for (const [mode, label] of view.modes) {
        const b = make("button", mode === (view.mode || "fabricar") ? "on" : "", label);
        b.disabled = busy !== null;
        b.addEventListener("click", () => {
            if (mode !== (view.mode || "fabricar") && busy === null) send("craft:mode", { mode });
        });
        host.appendChild(b);
    }
};

const draw = () => {
    showTitle(view.station, view.img, view.title);
    drawModes();
    $("sub").textContent = view.sub || "Nível " + view.level + " de " + (SKILLS[view.track] || "ofício") + " · " + view.recipes.filter((r) => r.can).length + " receita(s) prontas para fazer";
    drawCats();
    drawList();
    drawDetail();
};

/* ---------- The trade between two players: what each puts on the table (the money is one of the things, on the game's transfer screen), accept and cancel ---------- */

let trade = null;

const offerBox = (title, offer, mine) => {
    const box = make("div", "offer" + (offer.accepted ? " agreed" : ""));
    const head = make("div", "ohead");
    head.appendChild(make("b", null, title));
    head.appendChild(make("span", offer.accepted ? "yes" : null, offer.accepted ? "Aceitou" : mine ? "Você ainda não aceitou" : "Ainda não aceitou"));
    box.appendChild(head);
    const items = Array.isArray(offer.items) ? offer.items : [];
    if (items.length === 0) {
        box.appendChild(make("p", "onone", mine ? "Nenhum item. Use Mudar os meus itens para pôr o que quer trocar." : "Nenhum item."));
    } else {
        const grid = make("div", "ogrid");
        for (const item of items) {
            const cell = make("div", "oitem");
            const el = make("span", "slot s48");
            el.dataset.icon = item.icon || "";
            el.innerHTML = SIGNS.cloth;
            cell.appendChild(el);
            cell.appendChild(make("span", "cnt", "×" + item.n));
            const nm = make("span", "on", item.name);
            nm.title = item.name;
            cell.appendChild(nm);
            grid.appendChild(cell);
        }
        box.appendChild(grid);
    }
    return box;
};

const drawTrade = () => {
    const host = $("trade");
    host.innerHTML = "";
    if (!trade) {
        return;
    }
    showTitle("negociacao", trade.img, "Negociação");
    $("sub").textContent = "Com " + trade.partner + ". Fiquem perto um do outro; qualquer mudança desfaz os aceites.";
    const offers = make("div", "offers");
    offers.appendChild(offerBox("Você oferece", trade.mine, true));
    offers.appendChild(offerBox(trade.partner + " oferece", trade.theirs, false));
    host.appendChild(offers);
    const foot = make("div", "tfoot");
    const items = make("button", "btn ghost", "Mudar os meus itens");
    items.addEventListener("click", () => send("trade:items"));
    foot.appendChild(items);
    const accept = make("button", "btn go", trade.mine.accepted ? "Esperando " + trade.partner : "Aceitar a troca");
    accept.disabled = !!trade.mine.accepted;
    accept.addEventListener("click", () => send("trade:accept"));
    foot.appendChild(accept);
    const cancel = make("button", "btn ghost", "Cancelar");
    cancel.addEventListener("click", () => send("trade:cancel"));
    foot.appendChild(cancel);
    host.appendChild(foot);
    const msg = make("p", "msg");
    msg.id = "msg";
    host.appendChild(msg);
    reportSlots();
};

const setTrading = (on) => {
    $("panel").classList.toggle("trading", on);
    $("trade").hidden = !on;
    if (!on) {
        trade = null;
        $("trade").innerHTML = "";
    }
};

window.addEventListener("trade:view", (event) => {
    const next = event.detail;
    if (!next || next.mode !== "trade") {
        return;
    }
    trade = next;
    setTrading(true);
    drawTrade();
});
window.addEventListener("trade:end", () => {
    setTrading(false);
});

window.addEventListener("craft:view", (event) => {
    const next = event.detail;
    if (!next || !Array.isArray(next.recipes)) {
        return;
    }
    setTrading(false);
    const fresh = !view || view.station !== next.station || (view.mode || "") !== (next.mode || "");
    view = next;
    if (fresh) {
        dyeOf = {};
        picking = "";
        $("panel").classList.remove("picking");
        $("vpop").hidden = true;
    }
    if (!fresh && !view.recipes.some((r) => r.id === picked)) {
        picked = (view.recipes.find((r) => r.can) || view.recipes[0] || { id: "" }).id;
    }
    if (fresh) {
        cat = "";
        query = "";
        page = 0;
        $("q").value = "";
        picked = (view.recipes.find((r) => r.can) || view.recipes[0] || { id: "" }).id;
        lastSaid = null;
    }
    draw();
    if (lastSaid) {
        say(lastSaid[0], lastSaid[1]);
    }
    if (picking) {
        drawDyes();
    }
});
window.addEventListener("craft:progress", (event) => {
    const p = event.detail || {};
    lastSaid = null;
    busy = { id: p.id, ms: p.ms || 1000, doing: p.doing || "Trabalhando", at: Date.now(), i: p.i || 1, n: p.n || 1 };
    picked = p.id || picked;
    drawDetail();
});
window.addEventListener("craft:result", (event) => {
    const r = event.detail || {};
    busy = null;
    drawDetail();
    say(r.text || "", r.ok ? "good" : "bad");
});
window.addEventListener("craft:icons", (event) => {
    iconsOn = !!(event.detail && event.detail.on);
    document.body.classList.toggle("icons", iconsOn);
    lastSlots = "";
    reportSlots();
});

$("prev").addEventListener("click", () => {
    page = Math.max(0, page - 1);
    drawList();
});
$("next").addEventListener("click", () => {
    page += 1;
    drawList();
});
$("q").addEventListener("input", () => {
    query = $("q").value;
    page = 0;
    drawList();
});
/* Closing the page in a trade is leaving the trade: everything goes back. */
const leave = () => {
    if (trade) {
        send("trade:cancel");
    } else {
        send("craft:close");
    }
};
$("close").addEventListener("click", leave);
$("catBtn").addEventListener("click", () => {
    if (!closeCats() && view) {
        openCats();
    }
});
document.addEventListener("mousedown", (event) => {
    if (catList && !$("cats").contains(event.target)) {
        closeCats();
    }
});
document.addEventListener("keydown", (event) => {
    if ((event.keyCode || 0) === 27 || event.key === "Escape") {
        event.preventDefault();
        if (!closeDyes() && !closeCats()) {
            leave();
        }
    }
});
window.addEventListener("resize", () => {
    fit();
    if (trade) {
        drawTrade();
    } else if (view) {
        drawList();
        drawDetail();
    }
});

fit();
send("craft:ready");
if (document.fonts) {
    document.fonts.ready.then(reportSlots);
}
setInterval(() => (view || trade) && reportSlots(), 800);
</script>
</body>
</html>
