<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kingdom RP BRASIL - Voz</title>
<style>
    /* The voice indicator, drawn by us (user, 2026-10-23: "ícone do voip com a cor do alcance, sussurro, fala e grito, e aquele efeito de ruído do voip mostrando se falando
       alto ou baixo, acima da barra de vida, na parte inferior no centro da tela"; remade 2026-11-09: "vamos mudar a UI do voip para ser um ícone de voip com os sinais de som
       na esquerda e direita, minimalista, na mesma posição no centro da tela e com cor pelo alcance do voip"). A microphone with three sound waves on each side, no plate and no
       words: it is on show only while the player speaks, and for a moment after the range was changed with Y. The colour of the whole icon is the range's (whisper steel blue,
       speech gold, shout red); the waves that are lit are the microphone's level while the player speaks, and the range's (one, two, three) while they have only changed it. */
    :root {
        --whisper: #8dbfe3;
        --speech: #e6b34f;
        --shout: #e5503f;
        --tint: var(--speech);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { user-select: none; }

    .voice { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0; transform: translateY(.25rem) scale(.96); transition: opacity .35s ease, transform .35s ease; }
    .voice.on { opacity: 1; transform: none; }
    .voice.pop { animation: pop .45s ease-out; }
    @keyframes pop { 0% { transform: scale(1.14); } 100% { transform: none; } }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke: var(--tint);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* No plate to stand on: a dark edge keeps the icon legible on whatever the game shows behind it. */
        filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .85)) drop-shadow(0 0 5px rgba(0, 0, 0, .45));
        transition: stroke .2s ease;
    }
    .body { fill: transparent; transition: fill .1s ease; }
    .voice.talking .body { fill: var(--tint); }
    .wave { opacity: .18; transition: opacity .08s linear; }
    .wave.lit { opacity: 1; }

    .voice[data-tier="0"] { --tint: var(--whisper); }
    .voice[data-tier="1"] { --tint: var(--speech); }
    .voice[data-tier="2"] { --tint: var(--shout); }
</style>
</head>
<body>
<div class="voice" id="voice" data-tier="1">
    <svg viewBox="26 0 76 54" aria-hidden="true">
        <g>
            <rect class="body" x="58" y="8" width="12" height="24" rx="6"/>
            <path d="M52 26 A12 12 0 0 0 76 26"/>
            <path d="M64 38 V50"/>
            <path d="M56 50 H72"/>
        </g>
        <g id="left">
            <path class="wave" d="M49.4 13.4 A18 18 0 0 0 49.4 34.6"/>
            <path class="wave" d="M42.2 8.1 A27 27 0 0 0 42.2 39.9"/>
            <path class="wave" d="M34.9 2.8 A36 36 0 0 0 34.9 45.2"/>
        </g>
        <g id="right">
            <path class="wave" d="M78.6 13.4 A18 18 0 0 1 78.6 34.6"/>
            <path class="wave" d="M85.8 8.1 A27 27 0 0 1 85.8 39.9"/>
            <path class="wave" d="M93.1 2.8 A36 36 0 0 1 93.1 45.2"/>
        </g>
    </svg>
</div>

<script>
"use strict";

const send = (name, payload) => {
    if (typeof callEvent === "function") {
        callEvent(name, payload === undefined ? null : JSON.stringify(payload));
    }
};

const voice = document.getElementById("voice");
/* The waves of each side, the nearest to the microphone first. */
const waves = [Array.from(document.getElementById("left").children), Array.from(document.getElementById("right").children)];

/* How many waves are lit: while the player speaks, by how loud they are (one at the least, so that a voice that is sent is always seen); with the range only changed, the
   range's own count, one for a whisper, two for speech, three for a shout. */
const litFor = (talking, level, tier, flash) => {
    if (talking) {
        return 1 + (level > 0.3 ? 1 : 0) + (level > 0.62 ? 1 : 0);
    }
    return flash ? tier + 1 : 0;
};

let tier = -1;

const show = (state) => {
    if (typeof state !== "object" || state === null) {
        return;
    }
    const next = state.tier === 0 || state.tier === 1 || state.tier === 2 ? state.tier : 1;
    const changed = next !== tier;
    tier = next;
    voice.dataset.tier = String(next);
    const level = typeof state.level === "number" && state.level > 0 ? Math.min(1, state.level) : 0;
    const talking = state.talking === true && state.on === true;
    const count = state.on === true ? litFor(talking, level, next, state.flash === true) : 0;
    for (const side of waves) {
        side.forEach((wave, index) => wave.classList.toggle("lit", index < count));
    }
    voice.classList.toggle("talking", talking);
    voice.classList.toggle("on", state.on === true);
    if (state.flash === true && changed) {
        voice.classList.remove("pop");
        void voice.offsetWidth;
        voice.classList.add("pop");
    }
};

window.addEventListener("voice:state", (event) => show(event.detail));

send("voice:ready");
</script>
</body>
</html>
