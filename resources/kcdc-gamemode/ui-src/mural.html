<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kingdom RP BRASIL - Quadro de avisos</title>
<style>
    /* The notice board's page (src/client/mural.ts; the server's side is src/server/mural.ts, 2026-10-24: "uma hud no centro da tela sem ocupar a tela
       inteira, na nossa identidade visual, com nossas bordas de imagem e o título 'mural'"): a card of paper in the middle of the screen, the realm's
       look (the same paper, corners and red as the panel and the trades' page) with the user's painted title, in the panel's own plan: the letters on
       the left (the picture of their kind, and under it who put them up), the one that is chosen read on the right, or the form to put up a new one.
       The gothic face of the letters' "Boêmia" font is Grenze Gotisch (SIL Open Font License), cut down to Latin. */
    @font-face {
        font-family: "Cinzel";
        src: url("fonts/cinzel.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
    }
    @font-face {
        font-family: "Grenze Gotisch";
        src: url("fonts/grenze-gotisch.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
    }

    :root {
        --btn: rgba(124, 3, 5, 0.992);
        --btn-hi: rgb(152, 9, 12);
        --bg: rgba(210, 179, 140, 0.992);
        --ink: rgba(32, 27, 23, 0.99);
        --ink-2: rgba(32, 27, 23, .68);
        --rule: rgba(32, 27, 23, .30);
        --rule-soft: rgba(32, 27, 23, .15);
        --plate: rgba(238, 217, 182, .55);
        --display: "Cinzel", "Palatino Linotype", Georgia, serif;
        --body: "Constantia", "Sitka Text", Georgia, "Palatino Linotype", serif;
        --gothic: "Grenze Gotisch", "Old English Text MT", "Constantia", Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Larger since 2026-11-04 ("aumente a hud do quadro de avisos"): 1.7 % of the height (was 1.48), up to 24 px (was 17: a card lost on a big screen). */
    html { font-size: calc(clamp(12px, 1.7vh, 24px) * var(--ui, 1)); }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font: 1rem/1.5 var(--body); color: var(--ink); user-select: none; font-variant-numeric: lining-nums; }
    img { display: block; -webkit-user-drag: none; }
    [hidden] { display: none !important; }
    button { font-family: var(--display); color: inherit; cursor: pointer; background: none; border: 0; }
    button, button:focus, input, textarea { outline: none; }

    .stage { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, rgba(10, 6, 2, .38), rgba(10, 6, 2, .7)); animation: veil .3s ease both; }
    @keyframes veil { from { opacity: 0; } to { opacity: 1; } }

    .card { position: relative; display: flex; flex-direction: column; width: min(80rem, 96vw); height: min(50rem, 95vh); padding: 1rem 1.7rem 1rem; border: 1px solid var(--rule); box-shadow: 0 0 0 .45rem rgba(210, 179, 140, .22), 0 1.6rem 4rem rgba(10, 6, 2, .65); animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(1rem) scale(.99); } to { opacity: 1; transform: none; } }
    .paper { position: absolute; inset: 0; pointer-events: none; }
    .paper > .layer { position: absolute; inset: 0; }
    .base { background: var(--bg); }
    .photo { background: url("img/bg-hud.webp") center / cover no-repeat; opacity: .22; mix-blend-mode: multiply; }
    .grain { background: url("img/paper.svg"); mix-blend-mode: multiply; }
    .sheen { background: radial-gradient(ellipse 80% 55% at 24% 12%, rgba(255, 244, 214, .5), transparent 72%); }
    .inner { position: absolute; inset: .55rem; border: 1px solid var(--rule); pointer-events: none; }
    .orn { position: absolute; width: 6.4rem; height: auto; pointer-events: none; z-index: 3; filter: drop-shadow(0 .3rem .5rem rgba(20, 12, 4, .4)); }
    .orn-tl { top: -.8rem; left: -.8rem; }
    .orn-br { right: -.8rem; bottom: -.8rem; }
    .card > * { position: relative; }
    .card > .paper, .card > .inner, .card > .orn { position: absolute; }

    .x { position: absolute !important; top: .35rem; right: .45rem; z-index: 4; width: 2.1rem; height: 2.1rem; font: 400 1.5rem/1 var(--body); color: var(--ink-2); }
    .x:hover { color: var(--btn); }

    .head { flex: none; text-align: center; }
    .head-title { height: 3.7rem; width: auto; margin: 0 auto; }
    .head h1 { font: 700 1.9rem/1.1 var(--display); letter-spacing: .18em; text-transform: uppercase; }
    .boardname { margin-top: .1rem; font: 600 .78rem/1.3 var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--ink-2); }

    /* The two sections of the board: the posters, and the town's citizenship (2026-11-09; the information of the region of 2026-11-04 is gone). */
    .tabs { flex: none; display: flex; justify-content: center; gap: 1.6rem; margin-top: .3rem; }
    .tab { padding: .25rem .2rem .3rem; font: 700 .7rem/1.2 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); border-bottom: 2px solid transparent; transition: color .12s, border-color .12s; }
    .tab:hover { color: var(--ink); }
    .tab.on { color: var(--btn); border-bottom-color: var(--btn); }

    /* The gilded scroll bar of the panel. */
    *::-webkit-scrollbar { width: .7rem; }
    *::-webkit-scrollbar-track { background: linear-gradient(90deg, transparent 38%, rgba(32, 27, 23, .16) 38%, rgba(32, 27, 23, .16) 62%, transparent 62%); }
    *::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #cfa95f, #8a6a2c); background-clip: padding-box; border: 2px solid transparent; border-radius: .5rem; box-shadow: inset 0 0 0 1px rgba(70, 45, 10, .5); }
    *::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #e0bb73, var(--btn)); background-clip: padding-box; }

    .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 43fr) minmax(0, 57fr); gap: 1rem; margin-top: .6rem; padding-top: .7rem; border-top: 1px solid var(--rule); }
    .list, .detail { min-height: 0; display: flex; flex-direction: column; }
    .detail { padding-left: 1rem; border-left: 1px solid var(--rule); }

    .pub { display: block; width: 100%; padding: .7rem 1rem; background: var(--btn); color: var(--bg); border: 1px solid rgba(0, 0, 0, .4); font: 700 .86rem/1.2 var(--display); letter-spacing: .2em; text-transform: uppercase; transition: background .15s, transform .15s; }
    .pub small { display: block; margin-top: .15rem; font: 600 .66rem/1.2 var(--display); letter-spacing: .22em; opacity: .85; }
    .pub:hover:not(:disabled) { background: var(--btn-hi); transform: translateY(-1px); }
    .pub:disabled { opacity: .55; cursor: default; }

    /* The filters: three dropdowns and an icon (a menu of paper over the posters, closed by a click anywhere else). */
    .filters { position: relative; z-index: 6; margin-top: .55rem; display: flex; gap: .4rem; }
    .dd-wrap { position: relative; flex: 1; min-width: 0; }
    .dd-wrap.fixed { flex: none; }
    .dd { display: flex; align-items: center; gap: .4rem; width: 100%; padding: .42rem .55rem; color: var(--ink); background: rgba(255, 247, 226, .3); border: 1px solid var(--rule); font: 600 .62rem/1.2 var(--display); letter-spacing: .03em; text-transform: uppercase; transition: background .12s, border-color .12s; }
    .dd:hover, .dd.open { background: rgba(255, 247, 226, .5); border-color: var(--btn); }
    .dd .lab { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ic { flex: none; display: inline-grid; place-items: center; width: .95rem; height: .95rem; color: var(--btn); }
    .ic svg { width: 100%; height: 100%; fill: currentColor; }
    .dd .caret { width: .7rem; height: .7rem; color: var(--ink-2); }
    .dd.open .caret { color: var(--btn); }
    .dd-menu { position: absolute; top: calc(100% + .25rem); left: 0; z-index: 30; min-width: 100%; width: max-content; max-width: 17rem; padding: .25rem; background: rgba(222, 196, 158, .99); border: 1px solid var(--rule); box-shadow: 0 .6rem 1.6rem rgba(10, 6, 2, .5); }
    .dd-item { display: flex; align-items: center; gap: .55rem; width: 100%; padding: .42rem .55rem; text-align: left; font: 600 .68rem/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
    .dd-item:hover { background: rgba(124, 3, 5, .12); }
    .dd-item.on { color: var(--btn); }
    .dd-item .lab { flex: 1; white-space: nowrap; }
    .dd-item .lab.f-gothic { font: 400 1rem/1.1 var(--gothic); letter-spacing: 0; text-transform: none; }
    .dd-item img { flex: none; width: 1.1rem; height: auto; }
    .ibtn { flex: none; display: grid; place-items: center; width: 2.1rem; color: var(--ink-2); background: rgba(255, 247, 226, .3); border: 1px solid var(--rule); transition: background .12s, color .12s, border-color .12s; }
    .ibtn .ic { color: inherit; width: 1.05rem; height: 1.05rem; }
    .ibtn:hover { color: var(--ink); border-color: var(--btn); }
    .ibtn.on { background: var(--btn); color: var(--bg); border-color: rgba(0, 0, 0, .4); }
    .ibtn.bold-b { font: 700 .95rem/1 Georgia, serif; }

    .grid { flex: 1; min-height: 0; margin-top: .6rem; padding: .2rem .5rem .4rem .1rem; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: .7rem .6rem; align-content: start; }
    .poster { display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .35rem .3rem .45rem; text-align: center; border: 1px solid transparent; transition: background .12s, border-color .12s, transform .12s; }
    .poster:hover { background: rgba(255, 247, 226, .28); transform: translateY(-2px); }
    .poster.on { background: rgba(255, 247, 226, .4); border-color: var(--btn); box-shadow: 0 0 0 .18rem rgba(124, 3, 5, .14); }
    .poster img, .poster .noart { width: 6rem; height: auto; filter: drop-shadow(0 .2rem .3rem rgba(40, 24, 8, .45)); }
    .poster .noart { height: 9rem; display: grid; place-items: center; font: 700 .7rem/1.2 var(--display); border: 1px solid var(--rule); background: var(--plate); }
    .poster .who { max-width: 100%; margin-top: .2rem; font: 700 .72rem/1.2 var(--display); letter-spacing: .05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .poster .who.anon { font-style: italic; font-weight: 600; color: var(--ink-2); }
    .poster .ttl { max-width: 100%; font: italic .78rem/1.25 var(--body); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .poster .age { font: 600 .58rem/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); opacity: .8; }
    .poster.mine-p .who::after { content: " ✦"; color: var(--btn); }

    .empty { grid-column: 1 / -1; padding: 2.2rem 1rem; text-align: center; font: italic 1.04rem/1.5 var(--body); color: var(--ink-2); }
    .empty b { display: block; margin-bottom: .3rem; font: 700 .86rem/1.2 var(--display); letter-spacing: .2em; text-transform: uppercase; font-style: normal; color: var(--ink); }

    .detail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: .5rem; }
    .hint { padding: 3rem 1rem; text-align: center; font: italic 1.08rem/1.5 var(--body); color: var(--ink-2); }
    .kind { font: 700 .66rem/1.2 var(--display); letter-spacing: .3em; text-transform: uppercase; color: var(--btn); }
    .detail h2 { margin-top: .25rem; font: 700 1.4rem/1.2 var(--display); letter-spacing: .04em; overflow-wrap: anywhere; }
    .meta { margin-top: .35rem; padding-bottom: .55rem; border-bottom: 1px solid var(--rule); font: 600 .74rem/1.45 var(--display); letter-spacing: .06em; color: var(--ink-2); }
    .meta b { color: var(--ink); }
    .meta .anon { font-style: italic; }

    /* The letter's own text: the style the author chose (font, bold, spacing, alignment). */
    .letter { margin-top: .8rem; font: 1.12rem/1.55 var(--body); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .letter.f-bohemia { font-family: var(--gothic); font-size: 1.32rem; }
    .letter.bold { font-weight: 700; }
    .letter.sp-tight { line-height: 1.22; }
    .letter.sp-normal { line-height: 1.55; }
    .letter.sp-wide { line-height: 2; letter-spacing: .03em; }
    .letter.al-center { text-align: center; }

    .actions { flex: none; margin-top: .6rem; padding-top: .55rem; border-top: 1px solid var(--rule); display: flex; gap: .6rem; justify-content: flex-end; }
    .btn { padding: .55rem 1.3rem; background: var(--btn); color: var(--bg); border: 1px solid rgba(0, 0, 0, .4); font: 700 .76rem/1 var(--display); letter-spacing: .18em; text-transform: uppercase; transition: background .15s, transform .15s; }
    .btn:hover:not(:disabled) { background: var(--btn-hi); transform: translateY(-1px); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
    .btn.ghost:hover:not(:disabled) { background: rgba(124, 3, 5, .1); }

    /* The form of a new letter. */
    .form h2 { font-size: 1.25rem; }
    .field { margin-top: .6rem; }
    .field > label, .lab { display: block; margin-bottom: .22rem; font: 700 .6rem/1.2 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
    .kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .kinds button { display: flex; align-items: center; gap: .5rem; padding: .3rem .45rem; text-align: left; border: 1px solid var(--rule); background: rgba(255, 247, 226, .2); font: 700 .68rem/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; transition: background .12s, border-color .12s; }
    .kinds button:hover { background: rgba(255, 247, 226, .4); }
    .kinds button.on { border-color: var(--btn); background: rgba(255, 247, 226, .5); box-shadow: 0 0 0 .15rem rgba(124, 3, 5, .14); }
    .kinds img { width: 2.1rem; height: auto; flex: none; }
    input[type=text], textarea { width: 100%; padding: .45rem .6rem; font: 1.04rem/1.4 var(--body); color: var(--ink); background: rgba(255, 247, 226, .5); border: 1px solid var(--rule); user-select: text; }
    input[type=text]:focus, textarea:focus { border-color: var(--btn); box-shadow: 0 0 0 .15rem rgba(124, 3, 5, .14); }
    textarea { resize: none; height: 6rem; }
    ::placeholder { color: rgba(32, 27, 23, .45); font-style: italic; }
    .tools { display: flex; align-items: stretch; gap: .4rem; }
    .tools .dd-wrap { flex: none; width: 8.6rem; }
    .tools .ibtn { width: 2.3rem; }

    .count { float: right; font: 600 .6rem/1.2 var(--display); letter-spacing: .1em; color: var(--ink-2); }
    .count.over { color: var(--btn); }
    .preview { min-height: 2.6rem; max-height: 5rem; margin-top: .1rem; padding: .35rem .6rem; overflow-y: auto; border: 1px dashed var(--rule); background: rgba(255, 247, 226, .25); }
    .preview .letter { margin-top: 0; font-size: 1rem; }
    .preview .letter.f-bohemia { font-size: 1.18rem; }
    .check { display: flex; align-items: center; gap: .5rem; margin-top: .6rem; font: 600 .74rem/1.3 var(--display); letter-spacing: .06em; cursor: pointer; }
    .check i { flex: none; width: 1.05rem; height: 1.05rem; border: 1px solid var(--ink-2); background: rgba(255, 247, 226, .5); display: grid; place-items: center; font-style: normal; font-size: .85rem; color: var(--btn); }
    .check.on i::after { content: "✓"; font-weight: 700; }
    .feeline { margin-right: auto; align-self: center; font: italic .88rem/1.35 var(--body); color: var(--ink-2); text-align: left; }

    .foot { flex: none; display: flex; justify-content: space-between; gap: 1rem; margin-top: .55rem; padding-top: .45rem; border-top: 1px solid var(--rule); font: 600 .62rem/1.3 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
    .foot b { color: var(--ink); }

    /* The Cidadania tab (2026-11-09): the town's crest on the left, what is known of it on the right, and the button that makes the player its citizen. */
    .grid.crest-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; margin-top: .9rem; padding: 0 1rem; text-align: center; }
    .crestwrap { display: grid; place-items: center; width: 15rem; height: 15rem; }
    .crestwrap img { max-width: 100%; max-height: 100%; width: auto; height: auto; filter: drop-shadow(0 .35rem .5rem rgba(40, 24, 8, .5)); }
    .crestwrap svg.shield { width: 62%; height: 62%; fill: none; stroke: var(--ink); stroke-width: .7; stroke-linejoin: round; opacity: .28; }
    .crest-pane h3 { margin-top: 1rem; font: 700 1.5rem/1.15 var(--display); letter-spacing: .08em; text-transform: uppercase; overflow-wrap: anywhere; }
    .crest-pane .short { display: block; width: 3rem; height: 3px; margin: .8rem 0 .2rem; background: var(--btn); }
    .facts { margin-top: .9rem; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .6rem 1.4rem; align-items: baseline; }
    .facts dt { font: 700 .62rem/1.3 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
    .facts dd { font: 600 1.06rem/1.35 var(--body); overflow-wrap: anywhere; }
    .facts dd.warn { color: var(--btn); }
    .facts dd.none { font-style: italic; font-weight: 400; color: var(--ink-2); }
    .note { margin-top: 1rem; font: italic 1rem/1.5 var(--body); color: var(--ink-2); }
    .note.ask { font-style: normal; font-weight: 600; color: var(--ink); }

    .toast { position: absolute !important; left: 50%; bottom: 3.2rem; z-index: 5; max-width: 80%; padding: .55rem 1.2rem; transform: translateX(-50%); font: 600 .9rem/1.3 var(--body); color: var(--bg); background: rgba(40, 30, 20, .94); border: 1px solid rgba(0, 0, 0, .5); box-shadow: 0 .5rem 1.4rem rgba(10, 6, 2, .5); animation: pop .22s ease both; pointer-events: none; }
    .toast.ok { background: rgba(38, 78, 28, .96); }
    .toast.bad { background: rgba(124, 3, 5, .96); }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, .5rem); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div class="stage" id="stage">
    <section class="card" id="card">
        <div class="paper"><div class="layer base"></div><div class="layer photo"></div><div class="layer grain"></div><div class="layer sheen"></div></div>
        <div class="inner"></div>
        <img class="orn orn-tl" src="img/frame-corner-tl.webp" alt="">
        <img class="orn orn-br" src="img/frame-corner-br.webp" alt="">
        <button class="x" id="close" aria-label="Fechar">&times;</button>

        <header class="head">
            <img class="head-title" id="titleImg" alt="" hidden>
            <h1 id="title">Muralis</h1>
            <p class="boardname" id="boardName"></p>
        </header>

        <nav class="tabs" id="tabs"></nav>

        <div class="main">
            <aside class="list">
                <button class="pub" id="newBtn"></button>
                <div class="filters" id="filters">
                    <div class="dd-wrap" id="ddKind"></div>
                    <div class="dd-wrap" id="ddDate"></div>
                    <div class="dd-wrap" id="ddOrder"></div>
                    <button class="ibtn" id="mineBtn"></button>
                </div>
                <div class="grid" id="grid"></div>
            </aside>
            <section class="detail" id="detail"></section>
        </div>

        <footer class="foot"><span id="footNote"></span><span id="coins"></span></footer>
        <div class="toast" id="toast" hidden></div>
    </section>
</div>

<script>
"use strict";

/* The player's own size for the server's pages (Opções, Resolução da interface), told by the client as ui:scale: the root size times it. */
window.addEventListener("ui:scale", (event) => {
    const scale = Number(event.detail && event.detail.scale);
    if (scale >= 0.5 && scale <= 2) document.documentElement.style.setProperty("--ui", String(scale));
});

const send = (name, payload) => {
    if (typeof callEvent === "function") {
        callEvent(name, payload === undefined ? null : JSON.stringify(payload));
    }
};
const $ = (id) => document.getElementById(id);
const make = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) {
        el.className = cls;
    }
    if (text !== undefined && text !== null) {
        el.textContent = text;
    }
    return el;
};

/* The words of the page, in the two languages the server speaks. */
const TEXT = {
    pt: {
        title: "Muralis",
        board: (name) => "Quadro de avisos de " + name,
        tabPosters: "Cartazes", tabTown: "Cidadania",
        townKind: "Cidadania",
        tLord: "Senhor das terras", tLordNone: "ninguém ainda",
        tLady: (label, courtesy) => (courtesy ? label + " das terras" : "Consorte do senhor"),
        tFamily: "Família", tFamilyOf: (name) => "Casa " + name,
        tCategory: "Categoria", tSeat: "Sede da casa", tLandOf: (name) => "Terra de " + name, tLands: "Terras",
        tCitizens: "População", tCitizensN: (n) => n + (n === 1 ? " cidadão" : " cidadãos"),
        tGate: "Cidadania", tOpen: "Aberta", tShut: "Fechada pelo senhor",
        tWar: "Guerra", tWarWith: (names) => "Em guerra com " + names, tPeace: "Em paz",
        tNpcs: "NPCs que vivem aqui",
        tMine: "Sua cidadania", tMineNone: "nenhuma",
        btnFirst: "Tornar-me cidadão", btnFree: "Mudar para cá (grátis)", btnPaid: (n) => "Mudar para cá (" + n + " moedas)", btnAdmin: "Mudar para cá (admin)", btnHere: "Sua cidadania", btnShut: "Cidadania fechada",
        btnSure: "Confirmar",
        askFirst: (name) => "Tornar-se cidadão de " + name + "?",
        askChange: (from, name) => "Deixar " + from + " e tornar-se cidadão de " + name + "?",
        noteFirst: (n) => "A primeira mudança depois desta é grátis; cada mudança seguinte custa " + n + " moedas.",
        noteFree: (n) => "Esta é a sua troca gratuita; as próximas custam " + n + " moedas.",
        notePaid: (n) => "A sua troca gratuita já foi usada: cada mudança custa " + n + " moedas.",

const KINDS = ["procurado", "recursos", "avisos"];

const townTab = () => tab === "town";

const nowMs = () => Date.now() + skew;

function toast(text, ok) {
    const el = $("toast");
    el.textContent = text;
    el.className = "toast " + (ok ? "ok" : "bad");
    el.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { el.hidden = true; }, 4200);
}

function icon(name) {
    const span = make("span", "ic");
    span.innerHTML = ICONS[name] || "";
    return span;
}

/* A dropdown: the button shows the choice made, a menu of paper lists the others (with a tick on the one chosen); a click anywhere else, or Esc, shuts it. */
let openMenu = null;

function closeMenu() {
    if (openMenu) {
        openMenu.menu.remove();
        openMenu.button.classList.remove("open");
        openMenu = null;
    }
}

function dropdown(host, config) {
    host.textContent = "";
    const current = config.items.find((item) => item.id === config.current) || config.items[0];
    const button = make("button", "dd");
    button.title = config.title || "";
    if (config.icon) {
        button.appendChild(icon(config.icon));
    }
    button.appendChild(make("span", "lab", current.short || current.label));
    const caret = icon("caret");
    caret.classList.add("caret");
    button.appendChild(caret);
    button.addEventListener("click", (event) => {
        event.stopPropagation();
        if (openMenu && openMenu.button === button) {
            closeMenu();
            return;
        }
        closeMenu();
        const menu = make("div", "dd-menu");
        config.items.forEach((item) => {
            const row = make("button", "dd-item" + (item.id === current.id ? " on" : ""));
            const url = item.art && art[item.art];
            if (typeof url === "string" && url.indexOf("data:image/") === 0) {
                const img = make("img");
                img.src = url;
                img.alt = "";
                row.appendChild(img);
            } else if (item.icon) {
                row.appendChild(icon(item.icon));
            }
            row.appendChild(make("span", "lab" + (item.gothic ? " f-gothic" : ""), item.label));
            if (item.id === current.id) {
                row.appendChild(icon("tick"));
            }
            row.addEventListener("click", (e) => {
                e.stopPropagation();
                closeMenu();
                config.onPick(item.id);
            });
            menu.appendChild(row);
        });
        host.appendChild(menu);
        button.classList.add("open");
        openMenu = { menu, button };
    });
    host.appendChild(button);
}

document.addEventListener("click", closeMenu);

function ago(at) {
    const hours = (nowMs() - at) / HOUR;
    if (hours < 1) {
        return t.agoNow;
    }
    const days = Math.floor(hours / 24);
    return days < 1 ? t.agoToday : t.agoDays(days);
}

function visible() {
    if (!data) {
        return [];
    }
    const now = nowMs();
    let list = data.posters.filter((poster) => poster.until > now);
    if (filter.kind !== "all") {
        list = list.filter((poster) => poster.c === filter.kind);
    }
    if (filter.date === "today") {
        list = list.filter((poster) => now - poster.at <= 24 * HOUR);
    } else if (filter.date === "three") {
        list = list.filter((poster) => now - poster.at <= 72 * HOUR);
    }
    if (filter.mine) {
        list = list.filter((poster) => poster.mine);
    }
    if (filter.order === "old") {
        list.sort((a, b) => a.at - b.at);
    } else if (filter.order === "kind") {
        list.sort((a, b) => KINDS.indexOf(a.c) - KINDS.indexOf(b.c) || b.at - a.at);
    } else {
        list.sort((a, b) => b.at - a.at);
    }
    return list;
}

function pictureOf(kind) {
    const url = art[kind];
    if (typeof url === "string" && url.indexOf("data:image/") === 0) {
        const img = make("img");
        img.src = url;
        img.alt = "";
        return img;
    }
    return make("div", "noart", t.kindOne[kind] || kind);
}


/* A faded shield: the crest of a town that has none (and of one whose picture did not come). */
function shieldMark() {
    const holder = document.createElement("div");
    holder.innerHTML = '<svg class="shield" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 L19.6 5.6 V11.4 C19.6 16.2 16.4 19.8 12 21.4 C7.6 19.8 4.4 16.2 4.4 11.4 V5.6 Z"/></svg>';
    return holder.firstChild;
}

/* The crest of a town: the link the lord's family gave (https only, drawn in an image and nothing else; a link that is no image leaves the faded shield), or the faded shield when there is none. */
function crestBox(town) {
    const box = make("div", "crestwrap");
    const shield = () => { box.textContent = ""; box.appendChild(shieldMark()); };
    const link = typeof town.crestUrl === "string" && /^https:[/][/][^ <>"']+$/i.test(town.crestUrl) && town.crestUrl.length <= 400 ? town.crestUrl : "";
    if (!link) {
        shield();
        return box;
    }
    const img = document.createElement("img");
    img.alt = town.name;
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.addEventListener("error", shield, { once: true });
    img.src = link;
    box.appendChild(img);
    return box;
}

function drawList() {
    const grid = $("grid");
    grid.textContent = "";
    grid.className = townTab() ? "grid crest-pane" : "grid";
    if (townTab()) {
        if (data && data.town) {
            grid.appendChild(crestBox(data.town));
            grid.appendChild(make("h3", null, data.town.name));
            grid.appendChild(make("i", "short"));
        }
        return;
    }
    const list = visible();
    if (list.length === 0) {
        const total = data ? data.posters.length : 0;
        const box = make("div", "empty");
        box.appendChild(make("b", null, total === 0 ? t.emptyBoard : t.emptyFilter));
        box.appendChild(document.createTextNode(total === 0 ? t.emptyBoardSub : t.emptyFilterSub));
        grid.appendChild(box);
        return;
    }
    list.forEach((poster) => {
        const card = make("button", "poster" + (poster.id === selected && !composing ? " on" : "") + (poster.mine ? " mine-p" : ""));
        card.title = poster.t;
        card.appendChild(pictureOf(poster.c));
        card.appendChild(make("span", "who" + (poster.an ? " anon" : ""), poster.an ? t.anon : poster.n));
        card.appendChild(make("span", "ttl", poster.t));
        card.appendChild(make("span", "age", ago(poster.at)));
        card.addEventListener("click", () => {
            selected = poster.id;
            composing = false;
            removeArmed = "";
            drawList();
            drawDetail();
        });
        grid.appendChild(card);
    });
}

/* The text of a letter with the style its author chose. */
function letterOf(text, style) {
    const el = make("div", "letter");
    el.textContent = text;
    if (style.font === "bohemia") {
        el.classList.add("f-bohemia");
    }
    if (style.bold) {
        el.classList.add("bold");
    }
    el.classList.add("sp-" + (style.spacing || "normal"));
    if (style.align === "center") {
        el.classList.add("al-center");
    }
    return el;
}

/* The Cidadania tab: what is known of the board's town, and the button that makes the player its citizen (asked twice, as a poster's removal is). */
function drawTown(host) {
    const town = data ? data.town : null;
    if (!town) {
        return;
    }
    const scroll = make("div", "detail-scroll");
    scroll.appendChild(make("div", "kind", t.townKind));
    scroll.appendChild(make("h2", null, town.name));
    const facts = make("dl", "facts");
    const add = (label, value, mode) => {
        facts.appendChild(make("dt", null, label));
        facts.appendChild(make("dd", mode || "", value));
    };
    add(t.tCategory, town.seatName ? t.tLandOf(town.seatName) : t.tSeat);
    if (!town.seatName && town.lands && town.lands.length) {
        add(t.tLands, town.lands.join(", "));
    }
    add(t.tLord, town.lord || t.tLordNone, town.lord ? "" : "none");
    if (town.consort) {
        add(t.tLady(town.consort.label, town.consort.courtesy), town.consort.name);
    }
    add(t.tFamily, town.family ? t.tFamilyOf(town.family) : "—", town.family ? "" : "none");
    add(t.tCitizens, t.tCitizensN(town.citizens));
    add(t.tGate, town.closed ? t.tShut : t.tOpen, town.closed ? "warn" : "");
    add(t.tWar, town.wars && town.wars.length ? t.tWarWith(town.wars.join(", ")) : t.tPeace, town.wars && town.wars.length ? "warn" : "");
    add(t.tNpcs, String(town.npcs || 0));
    add(t.tMine, town.mine || t.tMineNone, town.mine ? "" : "none");
    scroll.appendChild(facts);
    const kind = town.kind;
    const change = kind === "free" || kind === "paid" || kind === "admin";
    if (citizenArmed && (kind === "first" || change)) {
        scroll.appendChild(make("p", "note ask", change ? t.askChange(town.mine || "", town.name) : t.askFirst(town.name)));
    }
    const note = kind === "here" ? t.noteHere : kind === "closed" ? t.noteShut : kind === "first" ? t.noteFirst(town.price) : kind === "free" ? t.noteFree(town.price) : kind === "paid" ? t.notePaid(town.price) : kind === "admin" ? t.noteAdmin : "";
    scroll.appendChild(make("p", "note", note));
    scroll.appendChild(make("p", "note", t.noteAll));
    host.appendChild(scroll);
    const actions = make("div", "actions");
    const label = kind === "here" ? t.btnHere : kind === "closed" ? t.btnShut : kind === "first" ? t.btnFirst : kind === "free" ? t.btnFree : kind === "paid" ? t.btnPaid(town.price) : t.btnAdmin;
    const button = make("button", "btn", citizenArmed && kind !== "here" && kind !== "closed" ? t.btnSure : label);
    button.disabled = kind === "here" || kind === "closed";
    button.addEventListener("click", () => {
        if (button.disabled) {
            return;
        }
        if (!citizenArmed) {
            citizenArmed = true;
            drawDetail();
            return;
        }
        citizenArmed = false;
        button.disabled = true;
        send("mural:citizen", { board: data.board.id });
    });
    if (citizenArmed) {
        const back = make("button", "btn ghost", t.back);
        back.addEventListener("click", () => {
            citizenArmed = false;
            drawDetail();
        });
        actions.appendChild(back);
    }
    actions.appendChild(button);
    host.appendChild(actions);
}

function drawDetail() {
    const host = $("detail");
    host.textContent = "";
    if (townTab()) {
        drawTown(host);
        return;
    }
    if (composing) {
        drawForm(host);
        return;
    }
    const poster = data ? data.posters.find((one) => one.id === selected) : null;
    if (!poster) {
        host.appendChild(make("div", "hint", t.pick));
        return;
    }
    const scroll = make("div", "detail-scroll");
    scroll.appendChild(make("div", "kind", t.kindOne[poster.c] || poster.c));
    scroll.appendChild(make("h2", null, poster.t));
    const meta = make("div", "meta");
    meta.appendChild(document.createTextNode(t.posted + " "));
    meta.appendChild(make(poster.an ? "span" : "b", poster.an ? "anon" : "", poster.an ? t.anon : poster.n));
    meta.appendChild(document.createTextNode(" · " + ago(poster.at) + " · " + t.leaves(Math.ceil((poster.until - nowMs()) / HOUR))));
    scroll.appendChild(meta);
    scroll.appendChild(letterOf(poster.b, poster.s || {}));
    host.appendChild(scroll);
    if (poster.mine || (data && data.admin)) {
        const actions = make("div", "actions");
        const button = make("button", "btn ghost", removeArmed === poster.id ? t.removeSure : t.remove);
        button.addEventListener("click", () => {
            if (removeArmed !== poster.id) {
                removeArmed = poster.id;
                drawDetail();
                return;
            }
            removeArmed = "";
            send("mural:remove", { id: poster.id });
        });
        actions.appendChild(button);
        host.appendChild(actions);
    }
}

function styleOf() {
    const draft = cur();
    return { font: draft.font, bold: draft.bold, spacing: draft.spacing, align: draft.align };
}

function drawPreview() {
    const box = $("previewBox");
    if (!box) {
        return;
    }
    box.textContent = "";
    box.appendChild(letterOf(cur().body === "" ? " " : cur().body, styleOf()));
}

function drawForm(host) {
    const draft = cur();
    const fee = data ? data.fee : 10;
    const days = data ? data.days : 7;
    const limits = data ? data.limits : { title: 48, body: 900, lines: 22 };
    const scroll = make("div", "detail-scroll form");
    scroll.appendChild(make("h2", null, t.formTitle));

    /* A poster has a kind and may be anonymous. */
    const kindField = make("div", "field");
    kindField.appendChild(make("label", null, t.kindLabel));
    const kinds = make("div", "kinds");
    KINDS.forEach((kind) => {
        const button = make("button", kind === draft.kind ? "on" : "");
        button.appendChild(pictureOf(kind));
        button.appendChild(make("span", null, t.kindOne[kind]));
        button.addEventListener("click", () => {
            draft.kind = kind;
            drawDetail();
        });
        kinds.appendChild(button);
    });
    kindField.appendChild(kinds);
    scroll.appendChild(kindField);

    const titleField = make("div", "field");
    titleField.appendChild(make("label", null, t.titleLabel));
    const title = make("input");
    title.type = "text";
    title.maxLength = limits.title;
    title.placeholder = t.titlePh;
    title.value = draft.title;
    title.addEventListener("input", () => { draft.title = title.value; });
    titleField.appendChild(title);
    scroll.appendChild(titleField);
    const anon = make("div", "check" + (draft.anonymous ? " on" : ""));
    anon.appendChild(make("i"));
    anon.appendChild(make("span", null, t.anonCheck));
    anon.addEventListener("click", () => {
        draft.anonymous = !draft.anonymous;
        anon.classList.toggle("on", draft.anonymous);
    });
    scroll.appendChild(anon);

    /* The tools of the text: bold, the font and the spacing in dropdowns, the alignment in two icons; what they do is shown in the preview. */
    const tools = make("div", "field tools");
    const paintTools = () => {
        tools.textContent = "";
        const boldButton = make("button", "ibtn bold-b" + (draft.bold ? " on" : ""), "B");
        boldButton.title = t.bold;
        boldButton.addEventListener("click", () => {
            draft.bold = !draft.bold;
            paintTools();
            drawPreview();
        });
        tools.appendChild(boldButton);
        const fontWrap = make("div", "dd-wrap");
        dropdown(fontWrap, {
            icon: "font",
            title: t.font,
            current: draft.font,
            items: [{ id: "normal", label: t.fontNormal }, { id: "bohemia", label: t.fontBohemia, gothic: true }],
            onPick: (id) => { draft.font = id; paintTools(); drawPreview(); },
        });
        tools.appendChild(fontWrap);
        const spacingWrap = make("div", "dd-wrap");
        dropdown(spacingWrap, {
            icon: "spacing",
            title: t.spacing,
            current: draft.spacing,
            items: [{ id: "tight", label: t.spTight, icon: "spacing" }, { id: "normal", label: t.spNormal, icon: "spacing" }, { id: "wide", label: t.spWide, icon: "spacing" }],
            onPick: (id) => { draft.spacing = id; paintTools(); drawPreview(); },
        });
        tools.appendChild(spacingWrap);
        [["left", t.alLeft], ["center", t.alCenter]].forEach((one) => {
            const button = make("button", "ibtn" + (draft.align === one[0] ? " on" : ""));
            button.title = one[1];
            button.appendChild(icon(one[0]));
            button.addEventListener("click", () => {
                draft.align = one[0];
                paintTools();
                drawPreview();
            });
            tools.appendChild(button);
        });
    };
    paintTools();
    scroll.appendChild(tools);

    const textField = make("div", "field");
    const label = make("label", null, t.textLabel);
    const count = make("span", "count", "");
    label.appendChild(count);
    textField.appendChild(label);
    const area = make("textarea");
    area.maxLength = limits.body;
    area.placeholder = t.textPh;
    area.value = draft.body;
    const refresh = () => {
        count.textContent = area.value.length + "/" + limits.body;
        count.classList.toggle("over", area.value.length >= limits.body);
    };
    area.addEventListener("input", () => {
        draft.body = area.value;
        refresh();
        drawPreview();
    });
    refresh();
    textField.appendChild(area);
    scroll.appendChild(textField);

    const previewField = make("div", "field");
    previewField.appendChild(make("label", null, t.preview));
    const box = make("div", "preview");
    box.id = "previewBox";
    previewField.appendChild(box);
    scroll.appendChild(previewField);

    host.appendChild(scroll);

    const actions = make("div", "actions");
    actions.appendChild(make("p", "feeline", t.fee(fee, days)));
    const back = make("button", "btn ghost", t.back);
    back.addEventListener("click", () => {
        composing = false;
        drawList();
        drawDetail();
    });
    const go = make("button", "btn", t.publish(fee));
    go.id = "goBtn";
    go.addEventListener("click", () => {
        if (go.disabled) {
            return;
        }
        if (draft.body.trim().length < 8) {
            toast(t.needBody, false);
            return;
        }
        if (data && data.coins < fee) {
            toast(t.needCoins(fee), false);
            return;
        }
        go.disabled = true;
        sentAt = Date.now();
        send("mural:publish", { board: data.board.id, category: draft.kind, title: draft.title, body: draft.body, anonymous: draft.anonymous, style: styleOf() });
        clearTimeout(sentTimer);
        sentTimer = setTimeout(() => { go.disabled = false; }, 8000);
    });
    actions.appendChild(back);
    actions.appendChild(go);
    host.appendChild(actions);
    drawPreview();
}

function drawStatic() {
    t = TEXT[lang] || TEXT.pt;
    const fee = data ? data.fee : 10;
    const days = data ? data.days : 7;
    $("title").textContent = t.title;
    $("boardName").textContent = data ? t.board(data.board.name) : "";
    /* The two sections: the posters, and the town's citizenship (a board in a place that is no town has no second one). */
    const tabs = $("tabs");
    tabs.textContent = "";
    tabs.hidden = !(data && data.town);
    [["posters", t.tabPosters], ["town", t.tabTown]].forEach((one) => {
        const choice = make("button", "tab" + (tab === one[0] ? " on" : ""), one[1]);
        choice.addEventListener("click", () => {
            if (tab === one[0]) {
                return;
            }
            tab = one[0];
            selected = "";
            composing = false;
            removeArmed = "";
            citizenArmed = false;
            closeMenu();
            drawStatic();
            drawList();
            drawDetail();
        });
        tabs.appendChild(choice);
    });
    const button = $("newBtn");
    button.textContent = "";
    button.hidden = townTab();
    button.appendChild(document.createTextNode(t.newBtn));
    button.appendChild(make("small", null, t.newSub(fee)));
    $("filters").hidden = townTab();
    dropdown($("ddKind"), {
        icon: "kind",
        title: t.tipKind,
        current: filter.kind,
        items: [{ id: "all", label: t.kinds.all, short: t.kindsShort.all, icon: "kind" }, { id: "procurado", label: t.kinds.procurado, short: t.kindsShort.procurado, art: "procurado", icon: "kind" }, { id: "recursos", label: t.kinds.recursos, short: t.kindsShort.recursos, art: "recursos", icon: "kind" }, { id: "avisos", label: t.kinds.avisos, short: t.kindsShort.avisos, art: "avisos", icon: "kind" }],
        onPick: (id) => { filter.kind = id; drawStatic(); drawList(); },
    });
    dropdown($("ddDate"), {
        icon: "date",
        title: t.tipDate,
        current: filter.date,
        items: [{ id: "any", label: t.dates.any, short: t.datesShort.any, icon: "date" }, { id: "today", label: t.dates.today, short: t.datesShort.today, icon: "date" }, { id: "three", label: t.dates.three, short: t.datesShort.three, icon: "date" }],
        onPick: (id) => { filter.date = id; drawStatic(); drawList(); },
    });
    dropdown($("ddOrder"), {
        icon: "order",
        title: t.tipOrder,
        current: filter.order,
        items: [{ id: "new", label: t.orders.new, short: t.ordersShort.new, icon: "order" }, { id: "old", label: t.orders.old, short: t.ordersShort.old, icon: "order" }, { id: "kind", label: t.orders.kind, short: t.ordersShort.kind, icon: "order" }],
        onPick: (id) => { filter.order = id; drawStatic(); drawList(); },
    });
    const mine = $("mineBtn");
    mine.textContent = "";
    mine.appendChild(icon("mine"));
    mine.title = t.mine;
    mine.classList.toggle("on", filter.mine);
    $("footNote").textContent = townTab() ? t.townFoot : t.footNote(days);
    const coins = $("coins");
    coins.hidden = townTab();
    coins.textContent = "";
    coins.appendChild(document.createTextNode(t.coins + ": "));
    coins.appendChild(make("b", null, data ? String(Math.round(data.coins * 10) / 10).replace(".", ",") : "0"));
    $("close").setAttribute("aria-label", t.close);
}

function showView(detail) {
    const d = detail && typeof detail === "object" ? detail : {};
    lang = d.lang === "en" ? "en" : "pt";
    data = d;
    skew = typeof d.now === "number" ? d.now - Date.now() : 0;
    if (!Array.isArray(data.posters)) {
        data.posters = [];
    }
    if (!data.town || typeof data.town !== "object") {
        data.town = null;
        tab = "posters";
    }
    if (selected && !data.posters.some((poster) => poster.id === selected)) {
        selected = "";
    }
    drawStatic();
    drawList();
    drawDetail();
}

function setArt(detail) {
    art = detail && typeof detail === "object" ? detail : {};
    const url = art.mural;
    if (typeof url === "string" && url.indexOf("data:image/") === 0) {
        $("titleImg").src = url;
        $("titleImg").hidden = false;
        $("title").hidden = true;
    }
    if (data) {
        drawList();
        drawDetail();
    }
}

$("newBtn").addEventListener("click", () => {
    composing = true;
    removeArmed = "";
    drawList();
    drawDetail();
});
$("mineBtn").addEventListener("click", () => {
    filter.mine = !filter.mine;
    drawStatic();
    drawList();
});
$("close").addEventListener("click", () => send("mural:close"));
window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" || event.keyCode === 27) {
        event.preventDefault();
        if (openMenu) {
            closeMenu();
            return;
        }
        send("mural:close");
    }
});

/* A board is opened afresh each time: the list, not the form; what was typed stays in the draft. */
window.addEventListener("mural:open", () => {
    closeMenu();
    composing = false;
    removeArmed = "";
    citizenArmed = false;
    selected = "";
    if (data) {
        drawList();
        drawDetail();
    }
});
window.addEventListener("mural:art", (event) => setArt(event.detail));
window.addEventListener("mural:view", (event) => showView(event.detail));
window.addEventListener("mural:result", (event) => {
    const d = event.detail && typeof event.detail === "object" ? event.detail : {};
    clearTimeout(sentTimer);
    const go = $("goBtn");
    if (go) {
        go.disabled = false;
    }
    if (d.what === "citizen") {
        citizenArmed = false;
    }
    if (typeof d.message === "string" && d.message !== "") {
        toast(d.message, d.ok === true);
    }
    if (d.ok === true && d.what === "publish") {
        cur().title = "";
        cur().body = "";
        composing = false;
        if (typeof d.id === "string") {
            selected = d.id;
        }
        drawList();
        drawDetail();
    } else if (d.ok === true && d.what === "remove") {
        selected = "";
        removeArmed = "";
        drawList();
        drawDetail();
    }
});

drawStatic();
drawList();
drawDetail();
send("mural:ready");
</script>
</body>
</html>
