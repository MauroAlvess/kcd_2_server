       e não quadrado ... mais emotes"): a wheel of the panel's paper in the middle of the screen, the first segment straight up and the rest
       clockwise as the game's own wheel numbers them, each with its drawing; the name of the one pointed at in the middle (and 1 to 9 and 0
       pick the first ten from the keyboard). A click plays it; G, Esc or a click outside the wheel closes it. The view covers the screen,
       transparent.
       2026-10-20: a click leaves no outline on a gesture ("não pode ter o efeito de borda ao clicar, fica quadrado"): the square was the
       focus ring of a clicked, focusable segment. The user's golden frame (`img/modulra roda de emote.png`) was tried round the wheel that
       afternoon and taken out again ("vamos tirar a moldura do G, ficou feio").
       2026-10-26 ("mais emotes, exemplo usar lampião ou levantar estandarte e coisas do tipo que o jogo deve ter"): the wheel opens on its
       groups (the greetings, the feelings, the face, the mood, the party, the faith, the things carried) and "Parar"; a group opens its own
       ring of gestures, and the middle takes back (Backspace too). Which gestures there are for the body is the server's to say (`emotes:list`,
       told by the client each time the wheel opens); until it is, everything is drawn. */
    @font-face {
        font-family: "Cinzel";
        src: url("fonts/cinzel.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
    }

    :root {
        --ink: #201b17;
        --ink-2: #5b4a39;
        --btn: #7c0305;
        --paper: #efe2c2;
        --display: "Cinzel", "Palatino Linotype", Georgia, serif;
        --body: "Constantia", "Sitka Text", Georgia, "Palatino Linotype", serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    *:focus, *:focus-visible, *:active { outline: none !important; }
    html { font-size: 16px; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; font: 1rem/1.4 var(--body); color: var(--ink); user-select: none; }

    #wheel {
        width: min(90vmin, 41rem);
        height: min(90vmin, 41rem);
        overflow: visible;
        filter: drop-shadow(0 1rem 2.2rem rgba(10, 6, 2, .6));
        animation: rise .16s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes swap { from { opacity: 0; } to { opacity: 1; } }
    .ring { animation: swap .12s ease both; }

    .seg { cursor: pointer; }
    .seg .shape { fill: var(--paper); stroke: rgba(32, 27, 23, .5); stroke-width: 1.2; transition: fill .12s; }
    .seg .glyph { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; transition: stroke .12s; }
    .seg .glyph * { fill: none; }
    .seg:hover .shape, .seg.on .shape { fill: var(--btn); stroke: #3d0203; }
    .seg:hover .glyph, .seg.on .glyph { stroke: #f6ead0; }
    .seg:active .shape { fill: #5a0204; }
    .seg .cap { fill: var(--ink-2); font: 600 8.5px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; text-anchor: middle; pointer-events: none; transition: fill .12s; }
    .seg:hover .cap, .seg.on .cap { fill: #f6ead0; }
    .seg.stop .shape { fill: #e3d2ab; }
    .seg.stop:hover .shape { fill: var(--btn); }

    .rim { fill: none; stroke: rgba(246, 234, 208, .28); stroke-width: 1; pointer-events: none; }
    .hub { fill: var(--paper); stroke: rgba(32, 27, 23, .55); stroke-width: 1.4; cursor: pointer; }
    .hub-in { fill: none; stroke: rgba(32, 27, 23, .22); stroke-width: 1; pointer-events: none; }
    .k { fill: var(--ink-2); font: 600 10px/1 var(--display); letter-spacing: .3em; text-transform: uppercase; text-anchor: middle; pointer-events: none; }
    .name { fill: var(--ink); font: 600 17px/1.15 var(--display); letter-spacing: .06em; text-transform: uppercase; text-anchor: middle; pointer-events: none; }
    .tip { fill: var(--ink-2); font: italic 12.5px/1.2 var(--body); text-anchor: middle; pointer-events: none; }
    .bar { fill: var(--btn); pointer-events: none; }
</style>
</head>

    { id: 124, group: "fe", label: "Rezar muito", icon: I.prayLong },
    { id: 125, group: "fe", label: "Ouvir a missa", icon: I.mass },
    { id: 126, group: "fe", label: "Pregar", icon: I.sermon },
    { id: 127, group: "fe", label: "Meditar", icon: I.meditate },

    { id: 128, group: "objetos", label: "Lampião", icon: I.lamp },
    { id: 129, group: "objetos", label: "Lampião fino", icon: I.lampFancy },
    { id: 130, group: "objetos", label: "Estandarte", icon: I.standard },
    { id: 131, group: "objetos", label: "Curativo", icon: I.bandage },
    { id: 132, group: "objetos", label: "Aquecer as mãos", icon: I.warm },
];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("wheel");
const make = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
};

const INNER = 80;
const OUTER = 218;
const GAP = 1.3;
const rad = (degrees) => (degrees * Math.PI) / 180;
const at = (r, degrees) => [r * Math.cos(rad(degrees)), r * Math.sin(rad(degrees))];
const sector = (a0, a1) => {
    const [x0, y0] = at(OUTER, a0), [x1, y1] = at(OUTER, a1), [x2, y2] = at(INNER, a1), [x3, y3] = at(INNER, a0);
    const f = (n) => n.toFixed(2);
    return "M" + f(x0) + " " + f(y0) + "A" + OUTER + " " + OUTER + " 0 0 1 " + f(x1) + " " + f(y1) + "L" + f(x2) + " " + f(y2) + "A" + INNER + " " + INNER + " 0 0 0 " + f(x3) + " " + f(y3) + "Z";
};

/* What the server said this body may play (a set of numbers), or null until it has said: then everything is drawn. */
let allowed = null;
/* "root" (the groups), or the id of the group whose ring is open. */
let view = "root";

const offered = (gesture) => allowed === null || allowed.has(gesture.id);
const gesturesOf = (group) => GESTURES.filter((gesture) => gesture.group === group && offered(gesture));
const groupsShown = () => GROUPS.filter((group) => gesturesOf(group.id).length > 0);

/* What the ring in sight holds, in its order: the groups and "Parar" at the root, the gestures of a group inside it. */
function itemsInSight() {
    if (view === "root") {
        const groups = groupsShown().map((group) => ({ kind: "group", id: group.id, label: group.label, icon: group.icon }));
        return groups.concat([{ kind: "stop", id: STOP, label: "Parar", icon: I.group.stop }]);
    }
    return gesturesOf(view).map((gesture) => ({ kind: "gesture", id: gesture.id, label: gesture.label, icon: gesture.icon }));
}

let chosen = null;
let tip = null;
let kicker = null;

/* The name in the middle fits the hub: a long one is set smaller. */
const setName = (text) => {
    chosen.textContent = text;
    const size = text.length <= 9 ? 17 : text.length <= 12 ? 14 : text.length <= 15 ? 11.5 : 10;
    chosen.setAttribute("style", "font-size:" + size + "px");
    tip.style.display = text === "" ? "" : "none";
};

function pick(item) {
    if (item.kind === "group") {
        view = item.id;
        draw();
    } else {
        send("emotes:play", { id: item.id });
    }
}

function draw() {
    svg.innerHTML = "";
    make("circle", { class: "rim", r: OUTER + 9 }, svg);
    const ring = make("g", { class: "ring" }, svg);
    const items = itemsInSight();
    const step = 360 / items.length;
    const atRoot = view === "root";
    items.forEach((item, index) => {
        const centre = -90 + index * step;
        const seg = make("g", { class: "seg" + (item.kind === "stop" ? " stop" : ""), role: "menuitem", "aria-label": item.label }, ring);
        make("path", { class: "shape", d: sector(centre - step / 2 + GAP, centre + step / 2 - GAP) }, seg);
        // At the root the segments are wide and carry their words, a little out from the drawing; in a group's ring they are narrow, and the middle says the name.
        const [ix, iy] = at(atRoot ? 126 : 149, centre);
        const glyph = make("g", { class: "glyph", transform: "translate(" + (ix - (atRoot ? 22 : 24)).toFixed(2) + " " + (iy - (atRoot ? 22 : 24)).toFixed(2) + ") scale(" + (atRoot ? 1.84 : 2) + ")" }, seg);
        glyph.innerHTML = item.icon;
        if (atRoot) {
            const [lx, ly] = at(177, centre);
            make("text", { class: "cap", x: lx.toFixed(2), y: (ly + 3).toFixed(2) }, seg).textContent = item.label;
        }
        seg.addEventListener("mouseenter", () => setName(item.label));
        seg.addEventListener("mouseleave", () => setName(""));
        seg.addEventListener("click", (event) => {
            event.stopPropagation();
            pick(item);
        });
    });

    const hub = make("g", {}, svg);
    const disc = make("circle", { class: "hub", r: INNER - 9 }, hub);
    make("circle", { class: "hub-in", r: INNER - 16 }, hub);
    kicker = make("text", { class: "k", y: -26 }, hub);
    kicker.textContent = atRoot ? "Gestos" : (GROUPS.find((group) => group.id === view) || { label: "" }).label;
    make("rect", { class: "bar", x: -14, y: -16, width: 28, height: 2 }, hub);
    chosen = make("text", { class: "name", y: 6 }, hub);
    tip = make("text", { class: "tip", y: 30 }, hub);
    tip.textContent = atRoot ? "escolha um grupo" : "voltar";
    disc.addEventListener("click", (event) => {
        event.stopPropagation();
        if (atRoot) {
            send("emotes:close");
        } else {
            view = "root";
            draw();
        }
    });
}

/* A click outside the wheel closes it. */
document.body.addEventListener("click", () => send("emotes:close"));

/* G and Esc close it, Backspace goes back to the groups, and 1 to 9 and 0 pick the first ten of the ring in sight, by what the game's browser is sure to fill in: the key's number. */
window.addEventListener("keydown", (event) => {
    const code = event.keyCode || event.which || 0;
    if (code === 27 || code === 71) {
        event.preventDefault();
        send("emotes:close");
        return;
    }
    if (code === 8) {
        event.preventDefault();
        if (view !== "root") {
            view = "root";
            draw();
        }
        return;
    }
    const slot = code >= 49 && code <= 57 ? code - 49 : code === 48 ? 9 : code >= 97 && code <= 105 ? code - 97 : code === 96 ? 9 : -1;
    const items = itemsInSight();
    if (slot >= 0 && slot < items.length) {
        event.preventDefault();
        pick(items[slot]);
    }
});

/* The client says the wheel was opened (back to the groups) and which gestures this body may play. */
window.addEventListener("emotes:open", () => {
    view = "root";
    draw();
});
window.addEventListener("emotes:list", (event) => {
    const ids = event.detail && Array.isArray(event.detail.ids) ? event.detail.ids : null;
    if (ids === null) return;
    allowed = new Set(ids.filter((id) => typeof id === "number"));
    if (view !== "root" && gesturesOf(view).length === 0) view = "root";
    draw();
});

draw();
send("emotes:ready");
</script>
</body>
</html>
